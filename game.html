<script>
"use strict";
/* =======================================================================
   SALAMANDER-X  v3
   - 能量晶体 + 数字键1-6直接升级对应能力（消耗1-6个能量体）
   - 关卡障碍物系统（不可摧毁，玩家需躲避）
   - 三关特色：陨石地带 / 堡垒内部 / 堡垒核心
   ======================================================================= */

const CVS = document.getElementById('game');
const CTX = CVS.getContext('2d');
const W = CVS.width, H = CVS.height;

const CFG = {
  scrollSpeed: 95,
  playerSpeedMax: 300,
  bulletSpeed: 420,           // 玩家子弹速度
  enemyBulletSpeed: 160,      // 敌弹速度
  fireCooldown: 0.156,        // 降低20%射速
  laserCooldown: 0.192,
  missileCooldown: 1.0,
  missileSpeed: 600,          // 追踪导弹基础速度（提速：原 420）
  maxCrystals: 10,            // 能量晶体上限
  invincibleTime: 1.4,
  spawnPadding: 40,
  playerHitScale: 0.5,
  maxBullets: 800,
  maxParticles: 500,
};

// 难度配置：fireMul=子弹发射间隔倍率（>1=更慢，<1=更快），hpMul=血量倍率
const DIFFICULTY = {
  easy:   { fireMul: 1.3, hpMul: 1.0, label: '简单', desc: '敌人子弹频率 -30%' },
  normal: { fireMul: 1.0, hpMul: 1.0, label: '普通', desc: '标准难度' },
  hard:   { fireMul: 0.7, hpMul: 1.5, label: '困难', desc: '敌人子弹频率 +30%, 血量 +50%' },
};
const DIFFICULTY_ORDER = ['easy','normal','hard'];

const COLORS = {
  player: '#5ef7ff', playerCore:'#fff', playerEngine:'#ff9a3c', playerWing:'#2bb6cc',
  bullet:'#bffcff', laser:'#ff4d8d', missile:'#ffd24d',
  enemy:'#ff5d7a', enemyBullet:'#ff9a3c',
  corrosive:'#7aff3a',           // 第5关腐蚀液：毒绿
  crystal:'#ffd24d',
  obstacle:'#8a6a4a', obstacleActive:'#ff4d6d',
  boss1:'#b07a3a', boss2:'#9a4dff', boss3:'#ff3a6d', boss4:'#ff3a1a',
  boss5:'#d0d0e0',                // 第5关骷髅 Boss：苍白骨色
  boss6:'#ff2030',                // 第6关巨型机器人：警戒血红
};

/* ------------------------------ 输入 ------------------------------ */
const Input = {
  keys:{}, pressed:{},
  init(){
    window.addEventListener('keydown', e=>{
      const k=e.key.toLowerCase();
      if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
      if(!this.keys[k]) this.pressed[k]=true;
      this.keys[k]=true;
    });
    window.addEventListener('keyup', e=>{ this.keys[e.key.toLowerCase()]=false; });
    window.addEventListener('blur', ()=>{ this.keys={}; });
  },
  clearPressed(){ this.pressed={}; },
  down(...ks){ return ks.some(k=>this.keys[k]); },
  justPressed(...ks){ return ks.some(k=>this.pressed[k]); },
};

/* ------------------------------ 音效 ------------------------------ */
const Audio2 = {
  ctx:null, enabled:true, master:null,
  init(){
    if(this.ctx) return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.5;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.enabled=false; }
  },
  // 基础音：单振荡器 + ADSR
  beep(f,d,t='square',v=0.05,slide=null){
    if(!this.enabled||!this.ctx) return;
    const t0=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=t; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(v,t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g).connect(this.master);
    o.start(t0); o.stop(t0+d);
  },
  // 和弦：同时多个频率
  chord(freqs,d,t='sine',v=0.05){
    if(!this.enabled||!this.ctx) return;
    for(const f of freqs) this.beep(f,d,t,v/freqs.length);
  },
  // 噪声：白噪声爆炸/击中
  noise(d,v=0.06,filter='lowpass',freq=800){
    if(!this.enabled||!this.ctx) return;
    const t0=this.ctx.currentTime;
    const bufferSize=this.ctx.sampleRate*d;
    const buf=this.ctx.createBuffer(1,bufferSize,this.ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type=filter; f.frequency.value=freq;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(v,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    src.connect(f).connect(g).connect(this.master);
    src.start(t0); src.stop(t0+d);
  },
  // 主炮：高频双鸣（方波 + 三角）
  shoot(){
    this.beep(880,0.05,'square',0.025,1400);
    this.beep(1320,0.04,'triangle',0.015,1800);
  },
  // 激光：合成器扫频（锯齿下扫 + 高频"嗡"声）
  laser(){
    this.beep(1400,0.1,'sawtooth',0.03,500);
    this.beep(2200,0.08,'triangle',0.015,1200);
  },
  // 导弹发射：低频"嗖"（三角上扫）
  missile(){
    this.beep(280,0.18,'triangle',0.05,880);
    this.beep(420,0.15,'sawtooth',0.02,1100);
  },
  // 普通击中：短促咔嚓
  hit(){
    this.beep(420,0.04,'square',0.02,180);
    this.noise(0.04,0.03,'highpass',1500);
  },
  // 普通爆炸：低频爆 + 噪声
  explode(){
    this.beep(160,0.22,'sawtooth',0.05,40);
    this.noise(0.2,0.06,'lowpass',600);
  },
  // 大爆炸：多层低频 + 噪声 + 高频脆响
  bigExplode(){
    this.beep(90,0.5,'sawtooth',0.08,25);
    this.beep(55,0.6,'triangle',0.06,18);
    this.noise(0.45,0.1,'lowpass',400);
    this.noise(0.2,0.05,'highpass',2000);
  },
  // 拾取：清脆上扬（双音）
  pickup(){
    this.beep(700,0.08,'sine',0.04,1400);
    setTimeout(()=>this.beep(1100,0.08,'sine',0.04,1700),60);
  },
  // 升级：和弦上扬（C-E-G-C 八度）
  levelup(){
    this.chord([523,659,784,1046],0.18,'sine',0.06);
    setTimeout(()=>this.chord([659,830,988,1318],0.2,'sine',0.05),100);
  },
  // 警报：双频方波警报
  alarm(){
    this.beep(440,0.15,'square',0.06,660);
    setTimeout(()=>this.beep(440,0.15,'square',0.06,330),200);
  },
  // 受伤：低频重击 + 噪声
  hurt(){
    this.beep(220,0.2,'square',0.06,80);
    this.noise(0.15,0.06,'lowpass',500);
  },
  // Boss 出现：低频隆隆 + 警报
  bossWarn(){
    this.beep(60,0.8,'sawtooth',0.08,40);
    this.beep(90,0.8,'triangle',0.05,50);
    setTimeout(()=>this.alarm(),400);
  },
  // Boss 死亡：长爆炸 + 上扬胜利和弦
  bossDead(){
    this.bigExplode();
    setTimeout(()=>this.chord([523,659,784],0.4,'sine',0.08),300);
    setTimeout(()=>this.chord([659,830,988],0.5,'sine',0.07),600);
  },
  // 关卡过渡：温柔上升音
  levelStart(){
    this.chord([392,494,587],0.3,'sine',0.05);
    setTimeout(()=>this.chord([523,659,784],0.4,'sine',0.05),200);
  },
  // 清屏：超能力横扫音
  screenClear(){
    this.beep(200,0.4,'sawtooth',0.06,2000);
    this.beep(400,0.4,'triangle',0.04,3000);
    this.noise(0.5,0.08,'bandpass',1500);
  },
  // 护盾激活：金属感环鸣
  shield(){
    this.beep(660,0.15,'sine',0.05,880);
    this.beep(990,0.12,'triangle',0.03,1320);
  },
  // 玩家死亡：悲剧下扬
  playerDead(){
    this.beep(440,0.6,'sawtooth',0.08,80);
    this.beep(220,0.8,'triangle',0.05,40);
    setTimeout(()=>this.noise(0.6,0.08,'lowpass',300),200);
  },
  // 胜利：辉煌和弦
  win(){
    this.chord([523,659,784,1046],0.4,'sine',0.07);
    setTimeout(()=>this.chord([659,830,988,1318],0.5,'sine',0.06),250);
    setTimeout(()=>this.chord([784,988,1175,1568],0.7,'sine',0.06),500);
  },
};

/* ------------------------------ 工具 ------------------------------ */
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }

/* ------------------------------ 粒子 ------------------------------ */
class Particle{
  constructor(x,y,vx,vy,life,color,size=3,gravity=0){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.life=life;this.maxLife=life;this.color=color;this.size=size;this.gravity=gravity;
    this.dead=false;
  }
  update(dt){
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.vy+=this.gravity*dt; this.life-=dt;
    if(this.life<=0) this.dead=true;
  }
  draw(ctx,camX){
    const a=clamp(this.life/this.maxLife,0,1);
    const s=this.size*a;
    // 发光粒子：外晕 + 内核
    ctx.globalAlpha=a*0.55;
    ctx.fillStyle=this.color;
    ctx.shadowBlur=8; ctx.shadowColor=this.color;
    ctx.beginPath(); ctx.arc(this.x-camX, this.y, s*1.6, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=a;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(this.x-camX, this.y, s*0.55, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
}
function spawnExplosion(particles,x,y,color,count=14,power=1){
  // 双色：主色 + 高亮白核
  for(let i=0;i<count;i++){
    const ang=rand(0,Math.PI*2), sp=rand(40,220)*power;
    particles.push(new Particle(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,rand(0.3,0.8),color,rand(2,5)));
  }
  // 少量白色亮核粒子，让爆炸更有冲击感
  for(let i=0;i<Math.max(3,Math.floor(count*0.3));i++){
    const ang=rand(0,Math.PI*2), sp=rand(60,260)*power;
    particles.push(new Particle(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,rand(0.15,0.4),'#ffffff',rand(1.5,3)));
  }
  while(particles.length>CFG.maxParticles) particles.shift();
}

/* ------------------------------ 背景视差 ------------------------------ */
class Starfield{
  constructor(theme){ this.theme=theme||'space'; this.setTheme(this.theme); this.layers=this.genLayers(); this.t=0; this._scanY=rand(0,H); }
  genLayers(){
    return [
      {stars:this.gen(70),speed:18,size:1,color:'#334'},
      {stars:this.gen(50),speed:50,size:1.5,color:'#778'},
      {stars:this.gen(30),speed:110,size:2,color:'#bbf',bright:true},
    ];
  }
  gen(n){ const a=[]; for(let i=0;i<n;i++) a.push({x:rand(0,W),y:rand(0,H)}); return a; }
  setTheme(t){ this.theme=t; this.themeObj=this.buildTheme(t); }
  buildTheme(t){
    if(t==='asteroid'){
      const rocks=[];
      for(let i=0;i<10;i++) rocks.push({x:rand(0,W*2),y:rand(0,H),r:rand(40,110),sp:rand(20,55),c:choice(['#3a2a1a','#4a3a2a','#2a1a0a'])});
      return {nebula:rocks};
    }
    if(t==='fortress'){
      const pipes=[];
      for(let i=0;i<6;i++) pipes.push({x:rand(0,W),y:rand(40,H-40),w:rand(60,160),sp:rand(40,90),gap:rand(120,260)});
      return {pipes};
    }
    if(t==='core'){
      const blobs=[];
      for(let i=0;i<6;i++) blobs.push({x:rand(0,W*2),y:rand(0,H),r:rand(120,240),sp:rand(10,30),c:choice(['#5a1a3a','#3a1a5a','#1a3a5a'])});
      return {nebula:blobs};
    }
    if(t==='starsea'){
      // 星海：漫天白色星点 + 大颗近景亮星 + 淡白光雾
      const stars=[];
      for(let i=0;i<120;i++) stars.push({x:rand(0,W),y:rand(0,H),r:rand(0.6,2.2),sp:rand(20,70),tw:rand(0,Math.PI*2)});
      const big=[];
      for(let i=0;i<14;i++) big.push({x:rand(0,W),y:rand(0,H),r:rand(2.5,5),sp:rand(40,90),tw:rand(0,Math.PI*2)});
      const mists=[];
      for(let i=0;i<5;i++) mists.push({x:rand(0,W*2),y:rand(0,H),r:rand(160,280),sp:rand(8,18),phase:rand(0,Math.PI*2)});
      return {stars,big,mists};
    }
    if(t==='fire'){
      // 火海：远景火焰云团（橙红 radial）+ 上升的火星粒子 + 底部炽热光带
      const clouds=[];
      for(let i=0;i<8;i++) clouds.push({x:rand(0,W*2),y:rand(H*0.2,H*0.9),r:rand(120,260),sp:rand(15,40),phase:rand(0,Math.PI*2),c:choice(['#ff5a1a','#ff3a0a','#c0280a','#9a1a08'])});
      const sparks=[];
      for(let i=0;i<60;i++) sparks.push({x:rand(0,W),y:rand(0,H),sp:rand(30,90),r:rand(1,2.5),vy:rand(-70,-30),tw:rand(0,Math.PI*2)});
      const embers=[];
      for(let i=0;i<14;i++) embers.push({x:rand(0,W*2),y:rand(H*0.6,H),r:rand(2,4.5),sp:rand(40,100),phase:rand(0,Math.PI*2)});
      return {clouds,sparks,embers};
    }
    if(t==='tomb'){
      // β星人墓穴：墓碑 + 飘动绿幽魂 + 拱门
      const tombs=[];
      for(let i=0;i<8;i++) tombs.push({x:rand(0,W*2),y:rand(60,H-60),w:rand(30,60),h:rand(40,80),sp:rand(15,40)});
      const wisps=[];
      for(let i=0;i<18;i++) wisps.push({x:rand(0,W),y:rand(0,H),r:rand(20,50),sp:rand(20,50),phase:rand(0,Math.PI*2),vy:rand(-8,-2)});
      return {tombs,wisps};
    }
    if(t==='escape'){
      // 逃脱要塞：要塞废墟残骸快速飞过 + 红色警示光带
      const ruins=[];
      for(let i=0;i<14;i++) ruins.push({x:rand(0,W*2),y:rand(0,H),w:rand(40,120),h:rand(20,50),sp:rand(140,260),c:choice(['#3a2a3a','#2a1a2a','#1a1a2a','#3a2a2a'])});
      const sparks=[];
      for(let i=0;i<30;i++) sparks.push({x:rand(0,W),y:rand(0,H),sp:rand(200,380),r:rand(1,2.5)});
      const alerts=[];
      for(let i=0;i<3;i++) alerts.push({x:rand(0,W*2),y:rand(0,H),w:rand(200,400),h:rand(8,20),sp:rand(40,80),phase:rand(0,Math.PI*2)});
      return {ruins,sparks,alerts};
    }
    const neb=[];
    for(let i=0;i<5;i++) neb.push({x:rand(0,W*2),y:rand(0,H),r:rand(120,260),c:choice(['#3a1a5a','#1a3a5a','#5a1a3a']),sp:rand(8,22)});
    return {nebula:neb};
  }
  update(dt,scrollSpeed){
    this.t += dt;
    this._scanY = (this._scanY + dt*60) % (H+80);
    for(const L of this.layers){
      const sp=(L.speed/110)*scrollSpeed;
      for(const s of L.stars){ s.x-=sp*dt; if(s.x<0){ s.x=W; s.y=rand(0,H); } }
    }
    if(this.themeObj.nebula){
      for(const n of this.themeObj.nebula){ n.x-=n.sp*dt; if(n.x<-n.r){ n.x=W+n.r; n.y=rand(0,H); } }
    }
    if(this.themeObj.pipes){
      for(const p of this.themeObj.pipes){ p.x-=p.sp*dt; if(p.x<-p.w){ p.x=p.gap; } }
    }
    if(this.themeObj.stars){
      // 星海：星点横向流动 + 闪烁相位
      for(const s of this.themeObj.stars){ s.x-=s.sp*dt; s.tw+=dt*3; if(s.x<-2){ s.x=W+2; s.y=rand(0,H); } }
      for(const s of this.themeObj.big){ s.x-=s.sp*dt; s.tw+=dt*2; if(s.x<-6){ s.x=W+6; s.y=rand(0,H); } }
      for(const m of this.themeObj.mists){ m.x-=m.sp*dt; m.phase+=dt*0.5; if(m.x<-m.r){ m.x=W+m.r; m.y=rand(0,H); } }
    }
    if(this.themeObj.clouds){
      // 火海：火焰云团横向漂移 + 脉动；火星上升 + 重置
      for(const c of this.themeObj.clouds){ c.x-=c.sp*dt; c.phase+=dt*1.5; if(c.x<-c.r){ c.x=W+c.r; c.y=rand(H*0.2,H*0.9); } }
    }
    if(this.themeObj.sparks){
      for(const s of this.themeObj.sparks){
        s.x-=s.sp*dt; s.y+=s.vy*dt; s.tw+=dt*5;
        if(s.y<-4){ s.y=H+4; s.x=rand(0,W); }
        if(s.x<-2){ s.x=W+2; s.y=rand(0,H); }
      }
    }
    if(this.themeObj.embers){
      for(const e of this.themeObj.embers){ e.x-=e.sp*dt; e.phase+=dt*2; if(e.x<-e.r){ e.x=W+e.r; e.y=rand(H*0.6,H); } }
    }
    if(this.themeObj.tombs){
      for(const tb of this.themeObj.tombs){ tb.x-=tb.sp*dt; if(tb.x<-tb.w){ tb.x=W+tb.w; tb.y=rand(60,H-60); tb.w=rand(30,60); tb.h=rand(40,80); } }
    }
    if(this.themeObj.wisps){
      for(const w of this.themeObj.wisps){
        w.x-=w.sp*dt; w.y+=w.vy*dt; w.phase+=dt*2;
        if(w.x<-w.r){ w.x=W+w.r; w.y=rand(0,H); }
        if(w.y<-w.r){ w.y=H+w.r; }
      }
    }
    if(this.themeObj.ruins){
      for(const r of this.themeObj.ruins){ r.x-=r.sp*dt; if(r.x<-r.w){ r.x=W+r.w; r.y=rand(0,H); r.w=rand(40,120); r.h=rand(20,50); } }
    }
    if(this.themeObj.sparks){
      for(const s of this.themeObj.sparks){ s.x-=s.sp*dt; if(s.x<-2){ s.x=W+2; s.y=rand(0,H); } }
    }
    if(this.themeObj.alerts){
      for(const a of this.themeObj.alerts){ a.x-=a.sp*dt; a.phase+=dt*3; if(a.x<-a.w){ a.x=W+a.w; a.y=rand(0,H); } }
    }
  }
  draw(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    if(this.theme==='fortress'){ g.addColorStop(0,'#0a0a14'); g.addColorStop(1,'#140a1a'); }
    else if(this.theme==='core'){ g.addColorStop(0,'#0a0510'); g.addColorStop(0.5,'#1a0820'); g.addColorStop(1,'#050208'); }
    else if(this.theme==='starsea'){ g.addColorStop(0,'#0a0e1a'); g.addColorStop(0.5,'#0e1530'); g.addColorStop(1,'#06081a'); }
    else if(this.theme==='fire'){ g.addColorStop(0,'#1a0608'); g.addColorStop(0.4,'#3a0e0a'); g.addColorStop(0.75,'#5a1a0a'); g.addColorStop(1,'#7a2a0a'); }
    else if(this.theme==='tomb'){ g.addColorStop(0,'#050a08'); g.addColorStop(0.5,'#0a1410'); g.addColorStop(1,'#020804'); }
    else if(this.theme==='escape'){ g.addColorStop(0,'#0a0510'); g.addColorStop(0.5,'#1a0820'); g.addColorStop(1,'#0a0410'); }
    else { g.addColorStop(0,'#05060f'); g.addColorStop(0.5,'#08081a'); g.addColorStop(1,'#04050c'); }
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(this.themeObj.nebula){
      const pulse=0.7+Math.sin(this.t*0.6)*0.3;
      for(const n of this.themeObj.nebula){
        const rg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
        rg.addColorStop(0,n.c+Math.floor(0x55*pulse).toString(16).padStart(2,'0')); rg.addColorStop(1,'transparent');
        ctx.fillStyle=rg;
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
      }
    }
    if(this.themeObj.pipes){
      ctx.fillStyle='#1a1a2a';
      for(const p of this.themeObj.pipes){
        const x=((p.x%W)+W)%W;
        ctx.fillRect(x,p.y,p.w,8);
        ctx.fillRect(x+10,p.y+14,p.w-20,6);
      }
    }
    if(this.themeObj.stars){
      // 星海：先铺一层淡白光雾，再画小星点，最后画大颗亮星 + 十字星芒
      for(const m of this.themeObj.mists){
        const a=0.05+Math.sin(m.phase)*0.03;
        const rg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);
        rg.addColorStop(0,'rgba(220,235,255,'+a+')'); rg.addColorStop(1,'rgba(180,210,255,0)');
        ctx.fillStyle=rg;
        ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle='#dde6f5';
      for(const s of this.themeObj.stars){
        const a=0.4+Math.sin(s.tw)*0.4;
        ctx.globalAlpha=a;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      // 大颗亮星：白色 + 十字星芒
      ctx.shadowBlur=10; ctx.shadowColor='#bcd5ff';
      for(const s of this.themeObj.big){
        const a=0.6+Math.sin(s.tw)*0.4;
        ctx.globalAlpha=a;
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
        // 十字星芒
        ctx.globalAlpha=a*0.5;
        ctx.fillRect(s.x-s.r*2.5, s.y-0.4, s.r*5, 0.8);
        ctx.fillRect(s.x-0.4, s.y-s.r*2.5, 0.8, s.r*5);
      }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
    }
    if(this.themeObj.clouds){
      // 火海：远景火焰云团（脉动橙红 radial + 发光）
      ctx.globalCompositeOperation='lighter';
      for(const c of this.themeObj.clouds){
        const pulse=0.6+Math.sin(c.phase)*0.4;
        const r=c.r*(0.85+Math.sin(c.phase*0.7)*0.15);
        const rg=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
        rg.addColorStop(0,'rgba(255,180,80,'+(0.42*pulse)+')');
        rg.addColorStop(0.4,'rgba(255,90,26,'+(0.28*pulse)+')');
        rg.addColorStop(1,'rgba(160,30,10,0)');
        ctx.fillStyle=rg;
        ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
      // 底部炽热光带（持续闪烁的橙红辉光）
      const heat=0.5+Math.sin(this.t*2.5)*0.15;
      const bg=ctx.createLinearGradient(0,H*0.7,0,H);
      bg.addColorStop(0,'rgba(255,90,26,0)');
      bg.addColorStop(1,'rgba(255,140,40,'+(0.35*heat)+')');
      ctx.fillStyle=bg; ctx.fillRect(0,H*0.7,W,H*0.3);
      // 上升的火星粒子（带辉光 + 闪烁）
      ctx.shadowBlur=8; ctx.shadowColor='#ff8a3a';
      for(const s of this.themeObj.sparks){
        const a=0.5+Math.sin(s.tw)*0.45;
        ctx.globalAlpha=a;
        ctx.fillStyle=(Math.sin(s.tw*2)>0)?'#ffd24d':'#ff7a3a';
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      // 大颗余烬（缓慢漂移的红炽光球）
      ctx.shadowBlur=12; ctx.shadowColor='#ff5a1a';
      for(const e of this.themeObj.embers){
        const pulse=0.7+Math.sin(e.phase)*0.3;
        ctx.globalAlpha=pulse;
        ctx.fillStyle='#ff5a1a';
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r*pulse,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,220,150,'+pulse+')';
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r*0.4*pulse,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
    }
    if(this.themeObj.tombs){
      // 远景墓碑（带阴影渐变）
      for(const tb of this.themeObj.tombs){
        const x=((tb.x%W)+W)%W;
        const tg=ctx.createLinearGradient(0,tb.y,0,tb.y+tb.h);
        tg.addColorStop(0,'#3a3a4a'); tg.addColorStop(1,'#1a1a26');
        ctx.fillStyle=tg;
        ctx.beginPath();
        ctx.moveTo(x,tb.y+tb.h); ctx.lineTo(x,tb.y+tb.h*0.3);
        ctx.quadraticCurveTo(x,tb.y,x+tb.w/2,tb.y);
        ctx.quadraticCurveTo(x+tb.w,tb.y,x+tb.w,tb.y+tb.h*0.3);
        ctx.lineTo(x+tb.w,tb.y+tb.h);
        ctx.closePath(); ctx.fill();
        // 墓碑十字
        ctx.fillStyle='#5a5a6a';
        ctx.fillRect(x+tb.w/2-2,tb.y+tb.h*0.2,4,tb.h*0.4);
        ctx.fillRect(x+tb.w/2-6,tb.y+tb.h*0.28,12,4);
      }
    }
    if(this.themeObj.wisps){
      // 飘动的绿幽魂（呼吸透明度）
      for(const w of this.themeObj.wisps){
        const a=0.2+Math.sin(w.phase)*0.15;
        const rg=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.r);
        rg.addColorStop(0,'rgba(122,255,58,'+a+')'); rg.addColorStop(1,'rgba(60,140,30,0)');
        ctx.fillStyle=rg;
        ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.fill();
      }
    }
    if(this.themeObj.ruins){
      // 要塞废墟残骸：暗色多边形块快速飞过
      for(const r of this.themeObj.ruins){
        const x=((r.x%W)+W)%W;
        const g=ctx.createLinearGradient(x,r.y,x,r.y+r.h);
        g.addColorStop(0,r.c); g.addColorStop(1,'#0a0a14');
        ctx.fillStyle=g;
        ctx.fillRect(x, r.y, r.w, r.h);
        // 边缘破损线
        ctx.strokeStyle='#1a0a1a'; ctx.lineWidth=1;
        ctx.strokeRect(x, r.y, r.w, r.h);
      }
    }
    if(this.themeObj.alerts){
      // 红色警示光带（横向流动）
      for(const a of this.themeObj.alerts){
        const x=((a.x%W)+W)%W;
        const alpha=0.08+Math.sin(a.phase)*0.06;
        ctx.fillStyle='rgba(255,40,80,'+alpha+')';
        ctx.fillRect(x, a.y, a.w, a.h);
      }
    }
    if(this.themeObj.sparks){
      // 高速飞过的能量火花
      ctx.fillStyle='#ff7a3c';
      ctx.shadowBlur=4; ctx.shadowColor='#ff5a3c';
      for(const s of this.themeObj.sparks){
        ctx.fillRect(s.x, s.y, s.r*2, s.r*0.6);
      }
      ctx.shadowBlur=0;
    }
    // 星点：远景暗淡 + 近景亮星带十字光
    const twinkle=0.7+Math.sin(this.t*3)*0.3;
    for(const L of this.layers){
      ctx.fillStyle=L.color;
      if(L.bright){
        ctx.shadowBlur=6; ctx.shadowColor=L.color;
      }
      for(const s of L.stars){
        ctx.fillRect(s.x,s.y,L.size,L.size);
        if(L.bright){
          // 十字星芒
          ctx.globalAlpha=0.5*twinkle;
          ctx.fillRect(s.x-L.size*2, s.y+L.size/2-L.size*0.1, L.size*5, L.size*0.2);
          ctx.fillRect(s.x+L.size/2-L.size*0.1, s.y-L.size*2, L.size*0.2, L.size*5);
          ctx.globalAlpha=1;
        }
      }
      if(L.bright){ ctx.shadowBlur=0; }
    }
    // 流动扫描线（细微动感）
    ctx.globalAlpha=0.06; ctx.fillStyle='#bffcff';
    ctx.fillRect(0, this._scanY, W, 2);
    ctx.globalAlpha=1;
    // 暗角：让前景元素更突出
    const vg=ctx.createLinearGradient(0,0,0,H);
    vg.addColorStop(0,'rgba(0,0,0,0.4)'); vg.addColorStop(0.5,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.4)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
}

/* ------------------------------ 子弹 ------------------------------ */
class Bullet{
  constructor(x,y,vx,vy,opts={}){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.w=opts.w||6; this.h=opts.h||6;
    this.dmg=opts.dmg||1;
    this.color=opts.color||COLORS.bullet;
    this.friendly=opts.friendly!==false;
    this.pierce=opts.pierce||false;
    this.laser=opts.laser||false;
    this.missile=opts.missile||false;
    this.corrosive=opts.corrosive||false;   // 腐蚀液：受重力下沉
    this.bossLaser=opts.bossLaser||false;   // Boss 激光子弹：命中扣 2 滴血
    this.target=opts.target||null;
    this.hits=new Set();
    this.dead=false;
    // 敌方子弹默认给足寿命：让屏幕边界负责回收，避免远距离弹道半途消失
    this.life=opts.life!==undefined?opts.life:(opts.friendly!==false?3:14);
    this.angle=opts.angle||0;
    this._drip=Math.random()*Math.PI*2;  // 腐蚀液滴落动画相位
  }
  update(dt, game){
    if(this.missile){
      // 失去目标后立即重选最近敌人（以导弹当前位置为搜索中心）
      if(!this.target || this.target.dead){
        this.target = game.findNearestEnemy(this.x, this.y);
      }
      if(this.target){
        const dx=this.target.x-this.x, dy=this.target.y-this.y;
        const m=Math.hypot(dx,dy)||1;
        const sp=Math.hypot(this.vx,this.vy);
        // 强追踪（0.16）：让导弹更快转向目标
        this.vx += (dx/m*sp-this.vx)*0.16;
        this.vy += (dy/m*sp-this.vy)*0.16;
        // 始终维持基础速度（避免追尾时减速）
        const cur=Math.hypot(this.vx,this.vy);
        const base=CFG.missileSpeed + (game.player? (game.player.missileLevel-1)*60 : 0);
        if(cur < base){
          this.vx = (cur>0? this.vx/cur:1) * base;
          this.vy = (cur>0? this.vy/cur:0) * base;
        }
        this.angle=Math.atan2(this.vy,this.vx);
      }
    }
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    // 腐蚀液：受重力下沉，呈现抛物线轨迹
    if(this.corrosive){ this.vy += 180*dt; }
    this._drip += dt*8;
    this.life-=dt;
    if(this.life<=0) this.dead=true;
  }
  bounds(){ return {x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}; }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    if(this.laser){
      // 放射状光线：从原点向后扩散的梯形光束
      const len=this.h;
      const tailW=this.w*0.4;
      ctx.shadowBlur=14; ctx.shadowColor=this.color;
      const g=ctx.createLinearGradient(sx,0,sx+len,0);
      g.addColorStop(0,this.color); g.addColorStop(0.6,'rgba(255,77,141,0.6)'); g.addColorStop(1,'rgba(255,77,141,0)');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(sx, this.y-this.w/2);
      ctx.lineTo(sx+len, this.y-tailW);
      ctx.lineTo(sx+len, this.y+tailW);
      ctx.lineTo(sx, this.y+this.w/2);
      ctx.closePath(); ctx.fill();
      // 内核高亮
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(sx, this.y-this.w/4);
      ctx.lineTo(sx+len, this.y-tailW*0.4);
      ctx.lineTo(sx+len, this.y+tailW*0.4);
      ctx.lineTo(sx, this.y+this.w/4);
      ctx.closePath(); ctx.fill();
    } else if(this.missile){
      ctx.translate(sx,this.y); ctx.rotate(this.angle);
      ctx.shadowBlur=8; ctx.shadowColor=this.color;
      ctx.fillStyle=this.color;
      ctx.beginPath();
      ctx.moveTo(8,0); ctx.lineTo(-6,-4); ctx.lineTo(-4,0); ctx.lineTo(-6,4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ff6a3c';
      ctx.fillRect(-8,-2,3,4);
    } else if(this.friendly){
      ctx.fillStyle=this.color;
      ctx.shadowBlur=8; ctx.shadowColor=this.color;
      ctx.fillRect(sx-this.w/2,this.y-this.h/2,this.w,this.h);
    } else if(this.corrosive){
      // 腐蚀液：绿色粘稠液滴 + 下垂尾迹 + 冒泡
      ctx.shadowBlur=10; ctx.shadowColor=COLORS.corrosive;
      const wob = Math.sin(this._drip)*1.2;
      // 拖尾液滴
      ctx.fillStyle='rgba(122,255,58,0.4)';
      ctx.beginPath(); ctx.arc(sx-this.vx*0.04, this.y-this.vy*0.04-2, this.w*0.55, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(sx-this.vx*0.08, this.y-this.vy*0.08-4, this.w*0.4, 0, Math.PI*2); ctx.fill();
      // 主液团（拉长椭圆 + 抖动）
      ctx.save();
      ctx.translate(sx, this.y);
      ctx.rotate(Math.atan2(this.vy, this.vx));
      const lg=ctx.createLinearGradient(-this.w, 0, this.w, 0);
      lg.addColorStop(0,'#3a8a1a'); lg.addColorStop(0.5,COLORS.corrosive); lg.addColorStop(1,'#d0ff8a');
      ctx.fillStyle=lg;
      ctx.beginPath();
      ctx.ellipse(0, wob*0.3, this.w*0.7, this.w*0.55, 0, 0, Math.PI*2);
      ctx.fill();
      // 高光气泡
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(-this.w*0.2, -this.w*0.15, this.w*0.18, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      // 敌弹：发光外晕 + 内核
      ctx.fillStyle=this.color;
      ctx.shadowBlur=8; ctx.shadowColor=this.color;
      ctx.beginPath(); ctx.arc(sx,this.y,this.w/2,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(sx,this.y,this.w/4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ------------------------------ 能量晶体（黄） ------------------------------ */
class Crystal{
  constructor(x,y){
    this.x=x;this.y=y;this.w=20;this.h=20;
    this.vx=-40;this.vy=0;this.t=0;this.dead=false;
  }
  bounds(){ return {x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}; }
  update(dt, player){
    this.t+=dt;
    if(player && player.alive){
      const dx=player.x-this.x, dy=player.y-this.y;
      const d=Math.hypot(dx,dy);
      const range=55;                // 仅接触时吸附
      if(d<range){
        const pull=2400;
        const inv=1/Math.max(d,0.5);
        this.vx += dx*inv*pull*dt;
        this.vy += dy*inv*pull*dt;
        this.vx*=0.82; this.vy*=0.82;
      } else {
        this.vx += (-40 - this.vx)*dt*3;
        this.vy *= 0.95;
      }
    }
    this.x+=this.vx*dt;
    this.y+=this.vy*dt + Math.sin(this.t*3)*8*dt;
    if(this.x<-40) this.dead=true;
  }
  apply(player){
    Audio2.pickup();
    player.crystals++;
    spawnExplosion(player.game.particles,this.x,this.y,COLORS.crystal,8,0.7);
    player.game.toast('能量 +1  (持有 '+player.crystals+')');
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    ctx.translate(sx,this.y);
    ctx.rotate(this.t*2);
    ctx.shadowBlur=14; ctx.shadowColor=COLORS.crystal;
    ctx.fillStyle=COLORS.crystal;
    ctx.beginPath();
    ctx.moveTo(0,-11); ctx.lineTo(9,0); ctx.lineTo(0,11); ctx.lineTo(-9,0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff8d0';
    ctx.beginPath();
    ctx.moveTo(0,-6); ctx.lineTo(4,0); ctx.lineTo(0,6); ctx.lineTo(-4,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* ------------------------------ 生命晶体（红） ------------------------------ */
class LifeDrop{
  constructor(x,y){
    this.x=x;this.y=y;this.w=22;this.h=22;
    this.vx=-40;this.vy=0;this.t=0;this.dead=false;
  }
  bounds(){ return {x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}; }
  update(dt, player){
    this.t+=dt;
    if(player && player.alive){
      const dx=player.x-this.x, dy=player.y-this.y;
      const d=Math.hypot(dx,dy);
      const range=60;                // 仅接触时吸附
      if(d<range){
        const pull=2600;
        const inv=1/Math.max(d,0.5);
        this.vx += dx*inv*pull*dt;
        this.vy += dy*inv*pull*dt;
        this.vx*=0.82; this.vy*=0.82;
      } else {
        this.vx += (-40 - this.vx)*dt*3;
        this.vy *= 0.95;
      }
    }
    this.x+=this.vx*dt;
    this.y+=this.vy*dt + Math.sin(this.t*2.5)*9*dt;
    if(this.x<-40) this.dead=true;
  }
  apply(player){
    Audio2.levelup();
    if(player.lives<5){
      player.lives++;
      spawnExplosion(player.game.particles,this.x,this.y,'#ff5d7a',14,1);
      player.game.toast('生命 +1  (剩余 '+player.lives+')');
    } else { player.game.toast('生命已满'); }
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    ctx.translate(sx,this.y);
    ctx.rotate(this.t*1.6);
    const pulse=1+Math.sin(this.t*4)*0.1;
    ctx.scale(pulse,pulse);
    ctx.shadowBlur=16; ctx.shadowColor='#ff5d7a';
    // 红色六角晶体
    ctx.fillStyle='#ff5d7a';
    ctx.beginPath();
    ctx.moveTo(0,-12); ctx.lineTo(10,-4); ctx.lineTo(10,4); ctx.lineTo(0,12); ctx.lineTo(-10,4); ctx.lineTo(-10,-4);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // 内核
    ctx.fillStyle='#ffd0dc';
    ctx.beginPath();
    ctx.moveTo(0,-7); ctx.lineTo(5,-2); ctx.lineTo(5,2); ctx.lineTo(0,7); ctx.lineTo(-5,2); ctx.lineTo(-5,-2);
    ctx.closePath(); ctx.fill();
    // 高光
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-3,-4, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ------------------------------ 清屏晶体（蓝绿） ------------------------------ */
class BombCrystal{
  constructor(x,y){
    this.x=x;this.y=y;this.w=24;this.h=24;
    this.vx=-40;this.vy=0;this.t=0;this.dead=false;
  }
  bounds(){ return {x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}; }
  update(dt, player){
    this.t+=dt;
    if(player && player.alive){
      const dx=player.x-this.x, dy=player.y-this.y;
      const d=Math.hypot(dx,dy);
      const range=65;                // 仅接触时吸附
      if(d<range){
        const pull=2800;
        const inv=1/Math.max(d,0.5);
        this.vx += dx*inv*pull*dt;
        this.vy += dy*inv*pull*dt;
        this.vx*=0.82; this.vy*=0.82;
      } else {
        this.vx += (-40 - this.vx)*dt*3;
        this.vy *= 0.95;
      }
    }
    this.x+=this.vx*dt;
    this.y+=this.vy*dt + Math.sin(this.t*2.2)*9*dt;
    if(this.x<-40) this.dead=true;
  }
  apply(player){
    // 可携带清屏晶体：库存满则立即触发，否则 +1 库存
    if(player.bombs >= 2){
      player.game.triggerScreenClear();
      player.game.toast('库存已满，立即清屏！');
    } else {
      player.bombs++;
      Audio2.pickup();
      spawnExplosion(player.game.particles,this.x,this.y,'#3affd2',12,1);
      player.game.toast('清屏晶体 +1  (持有 '+player.bombs+'/2, Shift 发动)');
    }
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    ctx.translate(sx,this.y);
    ctx.rotate(this.t*1.5);
    const pulse=1+Math.sin(this.t*5)*0.12;
    ctx.scale(pulse,pulse);
    ctx.shadowBlur=18; ctx.shadowColor='#3affd2';
    // 蓝绿八角星晶体
    ctx.fillStyle='#3affd2';
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4 - Math.PI/2;
      const r=i%2===0?13:6;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // 内核
    ctx.fillStyle='#bfffe8';
    ctx.beginPath();
    ctx.moveTo(0,-6); ctx.lineTo(4,0); ctx.lineTo(0,6); ctx.lineTo(-4,0);
    ctx.closePath(); ctx.fill();
    // 中心亮点
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(0,0, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ------------------------------ 障碍物（不可摧毁，玩家躲避） ------------------------------ */
class Obstacle{
  constructor(type,x,y,game){
    this.type=type; this.x=x; this.y=y; this.game=game;
    this.t=0; this.dead=false;
    this.setup();
  }
  setup(){
    switch(this.type){
      // 第一关：陨石墙（有缺口）、激光门
      case 'rock_wall':   this.w=40; this.h=240; this.gapY=rand(160,H-160); this.gapH=130; this.hp=999; break;
      case 'laser_gate':  this.w=14; this.h=H; this.cycle=2.4; this.activeT=1.2; break;
      // 第二关：移动墙壁、电场
      case 'moving_wall': this.w=36; this.h=160; this.baseY=this.y; this.amp=rand(60,120); this.hp=999; break;
      case 'electric':    this.w=120; this.h=40; this.cycle=2.0; this.activeT=1.0; break;
      // 第三关：能量屏障、尖刺
      case 'barrier':     this.w=20; this.h=H; this.cycle=1.8; this.activeT=0.9; break;
      case 'spike':       this.w=30; this.h=30; this.hp=999; break;
      // 第四关：火柱（上下交替喷射）
      case 'fire_pillar_top': this.w=50; this.h=260; this.cycle=2.2; this.activeT=1.3; break;
      case 'fire_pillar_bot': this.w=50; this.h=260; this.cycle=2.2; this.activeT=1.3; break;
      // 第六关·逃脱要塞：废墟墙（窄缺口）+ 激光阵列 + 碎片场
      case 'ruin_wall':   this.w=50; this.h=H; this.gapY=rand(140,H-140); this.gapH=95; this.hp=999; break;   // 窄缺口废墟墙
      case 'laser_array': this.w=18; this.h=H; this.cycle=1.6; this.activeT=0.7; this.gapY=rand(140,H-140); this.gapH=80; break; // 激光阵列（带缺口）
      case 'debris_block': this.w=70; this.h=70; this.hp=999; this.spin=0; this.ang=0; break;   // 静态大碎片块
    }
  }
  // 返回所有碰撞矩形（障碍物可能有多个碰撞区域，如带缺口的墙）
  hitBoxes(){
    switch(this.type){
      case 'rock_wall': return [
        {x:this.x-this.w/2, y:0, w:this.w, h:this.gapY-this.gapH/2},
        {x:this.x-this.w/2, y:this.gapY+this.gapH/2, w:this.w, h:H-(this.gapY+this.gapH/2)},
      ];
      case 'laser_gate': {
        const on = (this.t % this.cycle) < this.activeT;
        return on ? [{x:this.x-this.w/2, y:0, w:this.w, h:H}] : [];
      }
      case 'moving_wall': return [{x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}];
      case 'electric': {
        const on = (this.t % this.cycle) < this.activeT;
        return on ? [{x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}] : [];
      }
      case 'barrier': {
        const on = (this.t % this.cycle) < this.activeT;
        return on ? [{x:this.x-this.w/2, y:0, w:this.w, h:H}] : [];
      }
      case 'spike': return [{x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}];
      case 'fire_pillar_top': {
        const on = (this.t % this.cycle) < this.activeT;
        return on ? [{x:this.x-this.w/2, y:0, w:this.w, h:this.h}] : [];
      }
      case 'fire_pillar_bot': {
        const on = (this.t % this.cycle) < this.activeT;
        return on ? [{x:this.x-this.w/2, y:H-this.h, w:this.w, h:this.h}] : [];
      }
      // 第六关·逃脱要塞
      case 'ruin_wall': return [
        {x:this.x-this.w/2, y:0, w:this.w, h:this.gapY-this.gapH/2},
        {x:this.x-this.w/2, y:this.gapY+this.gapH/2, w:this.w, h:H-(this.gapY+this.gapH/2)},
      ];
      case 'laser_array': {
        const on = (this.t % this.cycle) < this.activeT;
        if(!on) return [];
        // 激光充满全屏，但留出 gapY 缺口
        return [
          {x:this.x-this.w/2, y:0, w:this.w, h:this.gapY-this.gapH/2},
          {x:this.x-this.w/2, y:this.gapY+this.gapH/2, w:this.w, h:H-(this.gapY+this.gapH/2)},
        ];
      }
      case 'debris_block': return [{x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}];
    }
    return [];
  }
  // 是否处于激活（危险）状态，用于绘制
  isActive(){
    if(['laser_gate','electric','barrier','fire_pillar_top','fire_pillar_bot','laser_array'].includes(this.type)){
      return (this.t % this.cycle) < this.activeT;
    }
    return true;
  }
  update(dt){
    this.t+=dt;
    if(this.type==='moving_wall'){
      this.y = this.baseY + Math.sin(this.t*1.5)*this.amp;
    }
    if(this.x < this.game.camX - 100) this.dead=true;
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    switch(this.type){
      case 'rock_wall':{
        // 上下两段岩石墙，中间缺口
        ctx.fillStyle='#5a4a3a';
        ctx.shadowBlur=6; ctx.shadowColor='#3a2a1a';
        ctx.fillRect(sx-this.w/2, 0, this.w, this.gapY-this.gapH/2);
        ctx.fillRect(sx-this.w/2, this.gapY+this.gapH/2, this.w, H-(this.gapY+this.gapH/2));
        // 缺口指示
        ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,210,77,0.15)';
        ctx.fillRect(sx-this.w/2, this.gapY-this.gapH/2, this.w, this.gapH);
        // 警告条纹
        ctx.fillStyle='#ffd24d';
        for(let yy=0; yy<this.gapY-this.gapH/2; yy+=20){
          ctx.fillRect(sx-this.w/2, yy, 4, 10);
        }
        for(let yy=this.gapY+this.gapH/2; yy<H; yy+=20){
          ctx.fillRect(sx-this.w/2, yy, 4, 10);
        }
        break;
      }
      case 'laser_gate':{
        const on=this.isActive();
        if(on){
          ctx.shadowBlur=14; ctx.shadowColor=COLORS.obstacleActive;
          const g=ctx.createLinearGradient(sx-this.w/2,0,sx+this.w/2,0);
          g.addColorStop(0,'rgba(255,77,109,0.3)'); g.addColorStop(0.5,'#ff4d6d'); g.addColorStop(1,'rgba(255,77,109,0.3)');
          ctx.fillStyle=g;
          ctx.fillRect(sx-this.w/2,0,this.w,H);
        } else {
          ctx.fillStyle='#445';
          ctx.fillRect(sx-2,0,4,H);
          // 顶端发射器
          ctx.fillStyle='#888';
          ctx.fillRect(sx-8,0,16,10);
          ctx.fillRect(sx-8,H-10,16,10);
        }
        break;
      }
      case 'moving_wall':{
        ctx.fillStyle='#6a5a4a';
        ctx.shadowBlur=6; ctx.shadowColor='#3a2a1a';
        ctx.fillRect(sx-this.w/2, this.y-this.h/2, this.w, this.h);
        ctx.shadowBlur=0;
        ctx.fillStyle='#ffd24d';
        ctx.fillRect(sx-this.w/2, this.y-this.h/2, 4, this.h);
        ctx.fillRect(sx+this.w/2-4, this.y-this.h/2, 4, this.h);
        break;
      }
      case 'electric':{
        const on=this.isActive();
        if(on){
          ctx.shadowBlur=12; ctx.shadowColor=COLORS.obstacleActive;
          ctx.fillStyle='rgba(255,77,109,0.25)';
          ctx.fillRect(sx-this.w/2, this.y-this.h/2, this.w, this.h);
          // 闪电纹
          ctx.strokeStyle='#ff4d6d'; ctx.lineWidth=2;
          ctx.beginPath();
          for(let i=0;i<4;i++){
            const x1=sx-this.w/2+i*this.w/4;
            ctx.moveTo(x1, this.y-this.h/2);
            ctx.lineTo(x1+rand(-8,8), this.y+rand(-10,10));
            ctx.lineTo(x1+rand(-8,8), this.y+this.h/2);
          }
          ctx.stroke();
        } else {
          ctx.strokeStyle='#556'; ctx.lineWidth=1;
          ctx.strokeRect(sx-this.w/2, this.y-this.h/2, this.w, this.h);
        }
        break;
      }
      case 'barrier':{
        const on=this.isActive();
        if(on){
          ctx.shadowBlur=16; ctx.shadowColor=COLORS.boss3;
          const g=ctx.createLinearGradient(sx-this.w/2,0,sx+this.w/2,0);
          g.addColorStop(0,'rgba(255,58,109,0.2)'); g.addColorStop(0.5,'#ff3a6d'); g.addColorStop(1,'rgba(255,58,109,0.2)');
          ctx.fillStyle=g;
          ctx.fillRect(sx-this.w/2,0,this.w,H);
        } else {
          ctx.fillStyle='#445';
          ctx.fillRect(sx-1,0,2,H);
        }
        break;
      }
      case 'spike':{
        ctx.fillStyle='#9a7a5a';
        ctx.shadowBlur=6; ctx.shadowColor='#5a3a1a';
        ctx.beginPath();
        ctx.moveTo(sx, this.y-this.h/2);
        ctx.lineTo(sx+this.w/2, this.y+this.h/2);
        ctx.lineTo(sx-this.w/2, this.y+this.h/2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#ffd24d';
        ctx.beginPath();
        ctx.moveTo(sx, this.y-this.h/2);
        ctx.lineTo(sx+3, this.y-this.h/2+6);
        ctx.lineTo(sx-3, this.y-this.h/2+6);
        ctx.closePath(); ctx.fill();
        break;
      }
      case 'fire_pillar_top':
      case 'fire_pillar_bot':{
        const on=this.isActive();
        const fromTop = this.type==='fire_pillar_top';
        const baseY = fromTop ? 0 : H;
        // 喷射器底座
        ctx.fillStyle='#5a2a1a';
        ctx.fillRect(sx-this.w/2-4, baseY-(fromTop?-14:H+14?0:0), this.w+8, 14);
        ctx.fillStyle='#7a3a1a';
        if(fromTop) ctx.fillRect(sx-this.w/2-4, 0, this.w+8, 14);
        else ctx.fillRect(sx-this.w/2-4, H-14, this.w+8, 14);
        if(on){
          const y0 = fromTop ? 14 : H-this.h;
          const flick = 0.7+Math.sin(this.t*30)*0.3;
          ctx.shadowBlur=20; ctx.shadowColor='#ff5a1a';
          const g=ctx.createLinearGradient(0,y0,0,y0+this.h);
          if(fromTop){
            g.addColorStop(0,'rgba(255,210,77,'+flick+')'); g.addColorStop(0.4,'#ff9a3c'); g.addColorStop(1,'rgba(255,58,26,0.2)');
          } else {
            g.addColorStop(0,'rgba(255,58,26,0.2)'); g.addColorStop(0.6,'#ff9a3c'); g.addColorStop(1,'rgba(255,210,77,'+flick+')');
          }
          ctx.fillStyle=g;
          ctx.fillRect(sx-this.w/2, y0, this.w, this.h);
          // 火星
          ctx.shadowBlur=0;
          ctx.fillStyle='#ffd24d';
          for(let i=0;i<5;i++){
            const fy = fromTop ? rand(y0,y0+this.h) : rand(y0,y0+this.h);
            ctx.fillRect(sx+rand(-this.w/2,this.w/2), fy, 2, 2);
          }
        }
        break;
      }
      // 第六关·逃脱要塞：废墟墙、激光阵列、碎片块
      case 'ruin_wall':{
        // 暗色金属废墟墙，带缺口
        const g=ctx.createLinearGradient(sx-this.w/2,0,sx+this.w/2,0);
        g.addColorStop(0,'#2a1a2a'); g.addColorStop(0.5,'#4a3a4a'); g.addColorStop(1,'#2a1a2a');
        ctx.fillStyle=g;
        ctx.fillRect(sx-this.w/2, 0, this.w, this.gapY-this.gapH/2);
        ctx.fillRect(sx-this.w/2, this.gapY+this.gapH/2, this.w, H-(this.gapY+this.gapH/2));
        // 缺口指示
        ctx.fillStyle='rgba(255,60,90,0.12)';
        ctx.fillRect(sx-this.w/2, this.gapY-this.gapH/2, this.w, this.gapH);
        // 警告条纹（红）
        ctx.fillStyle='#ff3a6a';
        for(let yy=0; yy<this.gapY-this.gapH/2; yy+=18){ ctx.fillRect(sx-this.w/2, yy, 4, 9); }
        for(let yy=this.gapY+this.gapH/2; yy<H; yy+=18){ ctx.fillRect(sx-this.w/2, yy, 4, 9); }
        // 破损边缘（锯齿状）
        ctx.fillStyle='#1a0a1a';
        for(let i=0;i<6;i++){
          const ex=sx-this.w/2 + i*this.w/6;
          ctx.fillRect(ex, this.gapY-this.gapH/2-4, 6, 4);
          ctx.fillRect(ex, this.gapY+this.gapH/2, 6, 4);
        }
        break;
      }
      case 'laser_array':{
        const on=this.isActive();
        if(on){
          ctx.shadowBlur=16; ctx.shadowColor='#ff3a6a';
          const g=ctx.createLinearGradient(sx-this.w/2,0,sx+this.w/2,0);
          g.addColorStop(0,'rgba(255,58,106,0.3)'); g.addColorStop(0.5,'#ff3a6a'); g.addColorStop(1,'rgba(255,58,106,0.3)');
          ctx.fillStyle=g;
          ctx.fillRect(sx-this.w/2, 0, this.w, this.gapY-this.gapH/2);
          ctx.fillRect(sx-this.w/2, this.gapY+this.gapH/2, this.w, H-(this.gapY+this.gapH/2));
          // 缺口光带（绿色通行提示）
          ctx.fillStyle='rgba(94,247,170,0.15)';
          ctx.fillRect(sx-this.w/2, this.gapY-this.gapH/2, this.w, this.gapH);
        } else {
          ctx.fillStyle='#3a2a3a';
          ctx.fillRect(sx-2, 0, 4, this.gapY-this.gapH/2);
          ctx.fillRect(sx-2, this.gapY+this.gapH/2, 4, H-(this.gapY+this.gapH/2));
          ctx.fillStyle='#666';
          ctx.fillRect(sx-8, 0, 16, 8);
          ctx.fillRect(sx-8, H-8, 16, 8);
        }
        break;
      }
      case 'debris_block':{
        // 静态大碎片块：金属岩石，带能量纹
        const r=this.w/2;
        const g=ctx.createRadialGradient(sx-r*0.3,this.y-r*0.3,r*0.1,sx,this.y,r);
        g.addColorStop(0,'#6a5a6a'); g.addColorStop(0.6,'#3a2a3a'); g.addColorStop(1,'#1a0a1a');
        ctx.fillStyle=g;
        ctx.shadowBlur=6; ctx.shadowColor='#1a0a1a';
        ctx.beginPath();
        ctx.moveTo(sx-r,this.y-r*0.7); ctx.lineTo(sx+r*0.8,this.y-r); ctx.lineTo(sx+r,this.y+r*0.6);
        ctx.lineTo(sx+r*0.5,this.y+r); ctx.lineTo(sx-r*0.8,this.y+r*0.8); ctx.lineTo(sx-r,this.y-r*0.2);
        ctx.closePath(); ctx.fill();
        // 能量纹
        ctx.shadowBlur=4; ctx.shadowColor='#ff3a6a';
        ctx.strokeStyle='#ff5a8a'; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(sx-r*0.5,this.y-r*0.3); ctx.lineTo(sx+r*0.2,this.y); ctx.lineTo(sx+r*0.4,this.y+r*0.4);
        ctx.stroke();
        break;
      }
    }
    ctx.restore();
  }
}

/* ------------------------------ 障碍物生成器（按关卡距离生成） ------------------------------ */
class ObstacleSpawner{
  constructor(game, type){
    this.game=game; this.type=type;
    this.spawned=false;
    // 每隔 distance 生成一个障碍物；escape 关卡更密
    this.interval = (type==='escape') ? 380 : 600;
    this.nextDist = (type==='escape') ? 300 : 450;
  }
  update(dt){
    if(this.game.scrollDistance >= this.nextDist && this.game.scrollDistance < this.game.level.length - 400){
      // 第六关后半段（纯障碍段）：使用更密集的生成模式
      const inObstacleOnly = this.type==='escape' && this.game.level.obstacleOnlyFrom
        && this.game.scrollDistance >= this.game.level.obstacleOnlyFrom;
      if(inObstacleOnly){
        this.spawnCluster();   // 一次生成一组（2-3 个）障碍
        this.nextDist += 1100 + rand(-100,200);   // 大间隔（≈1100），密度降至约 1/5
      } else {
        this.spawn();
        this.nextDist += this.interval + rand(-80,150);
      }
    }
  }
  spawn(){
    const x = this.game.camX + W + 60;
    const types = {
      asteroid: ['rock_wall','laser_gate','spike','rock_wall'],
      fortress: ['moving_wall','electric','moving_wall','spike'],
      core: ['barrier','spike','moving_wall','barrier'],
      fire: ['fire_pillar_top','fire_pillar_bot','spike','moving_wall'],
      tomb: ['spike','barrier','moving_wall','rock_wall'],     // 墓穴：尖刺 + 能量屏障 + 移动墙
      escape: ['ruin_wall','laser_array','debris_block','ruin_wall','debris_block'],   // 逃脱要塞：高密度障碍
    }[this.type];
    const t = choice(types);
    let y = rand(80, H-80);
    if(t==='rock_wall'||t==='ruin_wall'||t==='laser_array') y = H/2;
    if(t==='spike') y = choice([rand(40,80), rand(H-80,H-40), H/2]);
    if(t==='fire_pillar_top'||t==='fire_pillar_bot') y = H/2;
    if(t==='debris_block') y = choice([rand(80,140), rand(H-140,H-80), H/2, H/2-80, H/2+80]);
    this.game.obstacles.push(new Obstacle(t, x, y, this.game));
  }
  // 第六关后半段：一次生成一丛障碍物（2-3 个，纵向上错开形成通道）
  spawnCluster(){
    const baseX = this.game.camX + W + 60;
    // 随机选一种"丛"模式：上下夹击 / Z字通道 / 激光网格 / 密集碎片
    const mode = choice(['choke','zigzag','grid','debris_field','gauntlet']);
    if(mode==='choke'){
      // 上下夹击：上墙下墙留中间通道
      const gapY = rand(160, H-160);
      const gapH = rand(110, 150);
      this.game.obstacles.push(new Obstacle('ruin_wall', baseX, H/2, this.game));
      const o = this.game.obstacles[this.game.obstacles.length-1];
      o.gapY = gapY; o.gapH = gapH;
      // 紧跟着一个激光阵列穿过通道
      this.game.obstacles.push(new Obstacle('laser_array', baseX+180, H/2, this.game));
      const o2 = this.game.obstacles[this.game.obstacles.length-1];
      o2.gapY = gapY + rand(-50,50); o2.gapH = 100;
    } else if(mode==='zigzag'){
      // Z字通道：连续 3 个 ruin_wall，缺口交替上下
      for(let i=0;i<3;i++){
        const gapY = (i%2===0) ? rand(120,200) : rand(H-200, H-120);
        this.game.obstacles.push(new Obstacle('ruin_wall', baseX+i*180, H/2, this.game));
        const o = this.game.obstacles[this.game.obstacles.length-1];
        o.gapY = gapY; o.gapH = 120;
      }
    } else if(mode==='grid'){
      // 激光网格：两道激光阵列 + 一个碎片块
      this.game.obstacles.push(new Obstacle('laser_array', baseX, H/2, this.game));
      const o1 = this.game.obstacles[this.game.obstacles.length-1];
      o1.gapY = rand(140, H-140); o1.gapH = 90;
      this.game.obstacles.push(new Obstacle('laser_array', baseX+200, H/2, this.game));
      const o2 = this.game.obstacles[this.game.obstacles.length-1];
      o2.gapY = rand(140, H-140); o2.gapH = 90;
      this.game.obstacles.push(new Obstacle('debris_block', baseX+100, H/2, this.game));
    } else if(mode==='debris_field'){
      // 碎片群：3-4 个 debris_block 散布在不同高度
      const n = 3 + Math.floor(rand(0,2));
      for(let i=0;i<n;i++){
        const y = choice([rand(80,140), rand(H/2-60,H/2+60), rand(H-140,H-80)]);
        this.game.obstacles.push(new Obstacle('debris_block', baseX + i*90, y, this.game));
      }
    } else { // gauntlet
      // 综合考验：上墙 + 碎片块 + 下激光
      this.game.obstacles.push(new Obstacle('ruin_wall', baseX, H/2, this.game));
      const o1 = this.game.obstacles[this.game.obstacles.length-1];
      o1.gapY = rand(150, H-150); o1.gapH = 130;
      this.game.obstacles.push(new Obstacle('debris_block', baseX+150, o1.gapY+rand(-30,30), this.game));
      this.game.obstacles.push(new Obstacle('laser_array', baseX+300, H/2, this.game));
      const o3 = this.game.obstacles[this.game.obstacles.length-1];
      o3.gapY = o1.gapY + rand(-40,40); o3.gapH = 100;
    }
  }
}

/* ------------------------------ 僚机 ------------------------------ */
class Wingman{
  constructor(player,slot){
    this.player=player; this.slot=slot;
    this.x=player.x; this.y=player.y;
    this.w=22; this.h=16; this.t=0;
    this.fireTimer=rand(0.2,0.5);
    this.laserActive=false; // 僚机弱化版激光激活标志
    this.laserT=0;          // 僚机激光脉动时钟
  }
  update(dt){
    this.t+=dt;
    // 4 个僚机布局：上下各两个，前两架近，后两架远（每对靠拢机尾）
    // slot 0: 上近, 1: 下近, 2: 上远, 3: 下远
    const offsetX = -38 - Math.floor(this.slot/2)*22;
    const offsetY = (this.slot%2===0?-1:1) * (24 + Math.floor(this.slot/2)*18);
    const tx=this.player.x+offsetX, ty=this.player.y+offsetY;
    this.x += (tx-this.x)*0.18;
    this.y += (ty-this.y)*0.18;

    // 过渡期间不发射火力（与主炮一致）；手动开火（按住空格/J 才发射）
    const transitioning = (this.player.game.state==='LEVEL_OUT'||this.player.game.state==='LEVEL_IN');
    const firing = Input.down(' ','j') && this.player.alive && !transitioning;

    if(this.player.hasLaser){
      // 主炮激光 → 僚机用瘦版激光：与主炮同步开关
      this.laserActive = firing;
      if(this.laserActive){
        this.laserT += dt;
        this.updateLaser(dt);
      } else { this.laserT = 0; }
    } else {
      // 关闭激光（防止主炮切换后残留）
      this.laserActive = false;
      this.fireTimer -= dt;
      if(firing && this.fireTimer<=0){
        if(this.player.hasCannon){
          // 主炮散弹 → 僚机弱化版散弹：3 路扇形（主炮为 5 路）
          this.fireTimer = 0.34;
          this.fireSpread();
        } else {
          // 主炮普通 → 僚机普通单发子弹
          this.fireTimer = 0.28;
          this.fireNormal();
        }
      }
    }

    if(Math.random()<0.5){
      this.player.game.particles.push(new Particle(this.x-8,this.y+rand(-2,2),-rand(40,90),rand(-10,10),0.25,COLORS.playerEngine,rand(1,3)));
    }
  }
  fireNormal(){
    const g=this.player.game;
    g.addBullet(new Bullet(this.x+12,this.y,CFG.bulletSpeed,0,
      {w:6,h:6,dmg:1,color:COLORS.bullet,friendly:true}));
  }
  fireSpread(){
    const g=this.player.game;
    const sp=CFG.bulletSpeed;
    // 弱化版散弹：比主炮少 2 路（主炮 1级3 / 2级5 / 3级7，僚机 1路/3路/5路）
    const lv=this.player.spreadLevel;
    let angles;
    if(lv>=3){ angles=[0,-0.18,0.18,-0.32,0.32]; }       // 主炮7路→僚机5路
    else if(lv===2){ angles=[0,-0.18,0.18]; }              // 主炮5路→僚机3路
    else { angles=[0]; }                                   // 主炮3路→僚机1路
    for(const a of angles){
      g.addBullet(new Bullet(this.x+12,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:5,h:5,dmg:1,color:COLORS.bullet,friendly:true}));
    }
  }
  // 僚机弱化版激光：更窄光束 + dps 减半（主激光 halfH=9 / dps=10）
  updateLaser(dt){
    const g=this.player.game;
    const beamY=this.y;
    const startX=this.x+12;
    const endX=g.camX+W;
    const lv=this.player.laserLevel;
    // 僚机是主激光的弱化版：halfH 约 60%，dps 为主激光的 50%
    const halfH=4 + lv*1.2;       // 比主激光窄
    const dps=this.player.laserDps()*0.5;   // 主激光的 50% 伤害
    const col=this.player.laserColor();
    const dmg=dps*dt;
    for(const e of g.enemies){
      if(e.dead) continue;
      if(e.x < startX - e.w) continue;
      if(e.x > endX + e.w) continue;
      const eb=e.bounds();
      if(eb.y <= beamY+halfH && eb.y+eb.h >= beamY-halfH){
        e.takeDamage(dmg);
        if(Math.random()<0.25){ spawnExplosion(g.particles, e.x, beamY, col, 2, 0.4); }
      }
    }
    if(g.boss && !g.boss.dead){
      const bb=g.boss.bounds();
      if(g.boss.x+bb.w/2 >= startX && g.boss.x-bb.w/2 <= endX){
        if(bb.y <= beamY+halfH && bb.y+bb.h >= beamY-halfH){
          g.boss.takeDamage(dmg, true);
        }
      }
    }
  }
  // 绘制僚机瘦版激光射线
  drawLaser(ctx, camX){
    if(!this.laserActive) return;
    const sxStart=this.x+12-camX;
    const sxEnd=W;
    const beamY=this.y;
    const lv=this.player.laserLevel;
    const col=this.player.laserColor();
    const pulse=1+Math.sin(this.laserT*16)*0.18;
    const halfW=(3 + lv)*pulse;            // 比主激光窄
    ctx.save();
    // 外光晕
    ctx.shadowBlur=10 + lv*4; ctx.shadowColor=col;
    const g=ctx.createLinearGradient(sxStart,0,sxEnd,0);
    g.addColorStop(0, col);
    g.addColorStop(0.3, col+'b3');   // ~70%
    g.addColorStop(1, col+'1a');     // ~10%
    ctx.fillStyle=g;
    ctx.fillRect(sxStart, beamY-halfW, sxEnd-sxStart, halfW*2);
    // 内核白色亮线
    ctx.shadowBlur=0;
    const g2=ctx.createLinearGradient(sxStart,0,sxEnd,0);
    g2.addColorStop(0, '#fff');
    g2.addColorStop(0.5, 'rgba(255,255,255,0.6)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle=g2;
    ctx.fillRect(sxStart, beamY-halfW*0.25, sxEnd-sxStart, halfW*0.5);
    ctx.restore();
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    ctx.translate(sx,this.y);
    const flame=4+Math.sin(this.t*12)*2;
    // 小尾焰
    ctx.shadowBlur=8; ctx.shadowColor='#5ef7ff';
    ctx.fillStyle='rgba(94,247,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(-9,-1.5); ctx.lineTo(-13-flame,0); ctx.lineTo(-9,1.5);
    ctx.closePath(); ctx.fill();
    // 机身：流线型小箭头
    ctx.shadowBlur=6; ctx.shadowColor=COLORS.player;
    ctx.fillStyle=COLORS.playerWing;
    ctx.beginPath();
    ctx.moveTo(15,0);
    ctx.quadraticCurveTo(11,-2, 4,-3);
    ctx.lineTo(-8,-3);
    ctx.quadraticCurveTo(-11,-2, -10,-0.5);
    ctx.lineTo(-10,0.5);
    ctx.quadraticCurveTo(-11,2, -8,3);
    ctx.lineTo(4,3);
    ctx.quadraticCurveTo(11,2, 15,0);
    ctx.closePath(); ctx.fill();
    // 机身高光
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(12,-1.5); ctx.quadraticCurveTo(4,-3, -4,-3); ctx.lineTo(-8,-2);
    ctx.lineTo(-8,-1.5); ctx.quadraticCurveTo(4,-1, 10,-0.5);
    ctx.closePath(); ctx.fill();
    // 小后掠翼
    ctx.fillStyle=COLORS.playerWing;
    ctx.beginPath();
    ctx.moveTo(2,-2.5); ctx.lineTo(-4,-3); ctx.lineTo(-10,-9); ctx.lineTo(-12,-6); ctx.lineTo(-8,-1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2,2.5); ctx.lineTo(-4,3); ctx.lineTo(-10,9); ctx.lineTo(-12,6); ctx.lineTo(-8,1);
    ctx.closePath(); ctx.fill();
    // 翼上能量纹
    ctx.fillStyle='#7ffaff';
    ctx.shadowBlur=3; ctx.shadowColor='#5ef7ff';
    ctx.fillRect(-9,-7, 6, 0.8);
    ctx.fillRect(-9,6.2, 6, 0.8);
    ctx.shadowBlur=0;
    // 驾驶舱
    ctx.fillStyle='rgba(180,240,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(2,-2);
    ctx.quadraticCurveTo(6,-4, 11,-1.5);
    ctx.quadraticCurveTo(9,-0.5, 4,-1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.ellipse(6,-2.5, 1.5,0.5, -0.4, 0, Math.PI*2); ctx.fill();
    // 机头核心
    ctx.fillStyle=COLORS.playerCore;
    ctx.shadowBlur=4; ctx.shadowColor='#fff';
    ctx.beginPath(); ctx.arc(11,0, 1, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
    // 僚机激光射线（绘制在僚机之上）
    this.drawLaser(ctx, camX);
  }
}

/* ------------------------------ 玩家 ------------------------------ */
// 升级项定义：键1-6对应，消耗1-6个能量体
const UPGRADES = [
  { key:'1', id:'speed',  cost:1, name:'加速',   desc:'移动速度提升' },
  { key:'2', id:'missile',cost:2, name:'追踪弹', desc:'每秒发射2枚追踪导弹' },
  { key:'3', id:'spread', cost:3, name:'散弹',   desc:'扇形散射(3级:3/5/7路)' },
  { key:'4', id:'laser',  cost:4, name:'激光',   desc:'持续激光(3级:蓝/橙/红,与散弹互斥)' },
  { key:'5', id:'wingman',cost:5, name:'僚机',   desc:'增加1个僚机(最多4)' },
  { key:'6', id:'shield', cost:6, name:'护盾',   desc:'3次护盾抵挡(黄色,可重复购买补满)' },
];

class Player{
  constructor(game){
    this.game=game;
    this.x=160; this.y=H/2;
    this.vx=0; this.vy=0;
    this.w=38; this.h=24;
    this.lives=5;               // 初始 5 滴血，上限 5
    this.crystals=0;           // 持有能量晶体（上限10）
    this.abilities=new Set();  // 已解锁能力
    this.speedLevel=0;         // 加速等级 0-5
    this.missileLevel=0;       // 追踪导弹等级 0-3
    this.spreadLevel=0;        // 散弹等级 0-3（0=未解锁，1=3颗 2=5颗 3=7颗）
    this.laserLevel=0;         // 激光等级 0-3（0=未解锁，1=蓝 2=橙 3=红）
    this.fireTimer=0;
    this.missileTimer=1.0;
    this.invincible=0;
    this.engineFlick=0;
    this.alive=true;
    this.shieldHits=0;
    this.wingmen=[];
    this.shieldFlash=0;
    this.bombs=0;             // 携带清屏晶体（上限 2，Shift 发动）
    this.laserActive=false; // 激光持续激活标志
    this.laserT=0;          // 激光脉动时钟
  }
  get hasCannon(){ return this.abilities.has('spread'); }
  get hasLaser(){ return this.abilities.has('laser'); }
  get hasMissile(){ return this.missileLevel>0; }
  get hasWingman(){ return this.abilities.has('wingman'); }
  get hasShield(){ return this.abilities.has('shield'); }
  get hasSpeed(){ return this.speedLevel>0; }
  bounds(){ const s=CFG.playerHitScale; return {x:this.x-this.w*s/2,y:this.y-this.h*s/2,w:this.w*s,h:this.h*s}; }

  // 数字键1-6升级对应能力
  tryUpgrade(slot){
    if(slot<1||slot>6) return;
    const up = UPGRADES[slot-1];
    if(this.crystals < up.cost){ this.game.toast('能量不足: '+this.crystals+'/'+up.cost+' ('+up.name+')'); return; }
    // 加速：5级可重复升级
    if(up.id==='speed'){
      if(this.speedLevel>=5){ this.game.toast('加速已满级 5/5'); return; }
      this.crystals -= up.cost;
      this.speedLevel++;
      Audio2.levelup();
      this.game.toast('加速 Lv'+this.speedLevel+'/5 (-'+up.cost+'能量)');
      spawnExplosion(this.game.particles,this.x,this.y,COLORS.player,20,1.2);
      return;
    }
    // 追踪导弹：3级可重复升级，每次+2枚
    if(up.id==='missile'){
      if(this.missileLevel>=3){ this.game.toast('追踪弹已满级 3/3'); return; }
      this.crystals -= up.cost;
      this.missileLevel++;
      Audio2.levelup();
      this.game.toast('追踪弹 Lv'+this.missileLevel+'/3 (-'+up.cost+'能量)');
      spawnExplosion(this.game.particles,this.x,this.y,COLORS.missile,20,1.2);
      return;
    }
    // 散弹：3级可重复升级（1级3颗 2级5颗 3级7颗）
    if(up.id==='spread'){
      if(this.spreadLevel>=3){ this.game.toast('散弹已满级 3/3'); return; }
      this.crystals -= up.cost;
      this.spreadLevel++;
      Audio2.levelup();
      // 互斥：升级散弹时关闭激光
      if(this.laserLevel>0){ this.laserLevel=0; this.abilities.delete('laser'); this.game.toast('激光 → 散弹'); }
      this.abilities.add('spread');
      this.game.toast('散弹 Lv'+this.spreadLevel+'/3 ('+(this.spreadLevel===1?3:this.spreadLevel===2?5:7)+'路, -'+up.cost+'能量)');
      spawnExplosion(this.game.particles,this.x,this.y,COLORS.bullet,20,1.2);
      return;
    }
    // 激光：3级可重复升级（1级蓝 2级橙 3级红）
    if(up.id==='laser'){
      if(this.laserLevel>=3){ this.game.toast('激光已满级 3/3'); return; }
      this.crystals -= up.cost;
      this.laserLevel++;
      Audio2.levelup();
      // 互斥：升级激光时关闭散弹
      if(this.spreadLevel>0){ this.spreadLevel=0; this.abilities.delete('spread'); this.game.toast('散弹 → 激光'); }
      this.abilities.add('laser');
      const cn=this.laserLevel===1?'蓝':this.laserLevel===2?'橙':'红';
      this.game.toast('激光 Lv'+this.laserLevel+'/3 ('+cn+'色, -'+up.cost+'能量)');
      spawnExplosion(this.game.particles,this.x,this.y,COLORS.laser,20,1.2);
      return;
    }
    // 僚机/护盾可重复购买
    if(up.id!=='wingman' && up.id!=='shield' && this.abilities.has(up.id)){
      this.game.toast(up.name+' 已解锁');
      return;
    }
    this.crystals -= up.cost;
    Audio2.levelup();
    this.abilities.add(up.id);
    if(up.id==='wingman'){
      if(this.wingmen.length>=4){ this.game.toast('僚机已满 4/4'); this.crystals+=up.cost; return; }
      this.wingmen.push(new Wingman(this,this.wingmen.length));
    }
    if(up.id==='shield'){
      // 护盾：3 次抵挡，护盾存在时也可重复购买补满
      this.shieldHits=3;
      this.game.toast('护盾补满 3/3 (黄色)');
      this.shieldFlash=0.5;
      spawnExplosion(this.game.particles,this.x,this.y,'#ffd24d',24,1.4);
      return;
    }
    this.game.toast('解锁: '+up.name+' (-'+up.cost+'能量)');
    spawnExplosion(this.game.particles,this.x,this.y,COLORS.player,20,1.2);
  }
  update(dt){
    // 过渡动画期间：位置由 Game.update 控制，跳过输入与限位
    const transitioning = (this.game.state==='LEVEL_OUT'||this.game.state==='LEVEL_IN');
    if(!transitioning){
      // 数字键升级
      for(let i=1;i<=6;i++){ if(Input.justPressed(String(i))) this.tryUpgrade(i); }
      // Shift 触发清屏晶体
      if(Input.justPressed('shift') && this.bombs>0){
        this.bombs--;
        this.game.triggerScreenClear();
      }

      const maxSp = CFG.playerSpeedMax + this.speedLevel*110;  // 每级+110速度（增强效果）
      const accel = 2600 + this.speedLevel*700;                // 每级+700加速度（增强响应）
      let ax=0,ay=0;
      if(Input.down('arrowleft','a')) ax-=1;
      if(Input.down('arrowright','d')) ax+=1;
      if(Input.down('arrowup','w')) ay-=1;
      if(Input.down('arrowdown','s')) ay+=1;
      this.vx += ax*accel*dt;
      this.vy += ay*accel*dt;
      this.vx -= this.vx*12*dt;
      this.vy -= this.vy*12*dt;
      this.vx = clamp(this.vx,-maxSp,maxSp);
      this.vy = clamp(this.vy,-maxSp,maxSp);
      this.x += this.vx*dt; this.y += this.vy*dt;
      this.x = clamp(this.x, this.game.camX+24, this.game.camX+W-24);
      this.y = clamp(this.y, 16, H-16);

      // 武器开火：手动模式（按住空格/J 才开火；激光为持续射线也需按住）
      const firing = Input.down(' ','j');
      if(this.hasLaser){
        this.laserActive = firing;
        if(this.laserActive){
          if(this.laserT===0) Audio2.shoot();
          this.laserT+=dt;
          this.updateLaser(dt);
        } else { this.laserT=0; }
      } else {
        this.fireTimer-=dt;
        if(firing && this.fireTimer<=0) this.shoot();
      }

      if(this.hasMissile && firing){
        this.missileTimer-=dt;
        if(this.missileTimer<=0){ this.missileTimer=CFG.missileCooldown; this.fireMissiles(); }
      }
    } else {
      // 过渡中保持Y方向轻微跟随，避免突兀
      this.y += (H/2 - this.y)*3*dt;
    }

    if(this.invincible>0) this.invincible-=dt;
    if(this.shieldFlash>0) this.shieldFlash-=dt;
    this.engineFlick+=dt*30;
    for(const w of this.wingmen) w.update(dt);

    if(Math.random()<0.9){
      this.game.particles.push(new Particle(this.x-18,this.y+rand(-5,5),-rand(80,160),rand(-20,20),0.3,COLORS.playerEngine,rand(2,4)));
    }
    if(this.speedLevel>0 && Math.random()<0.3+this.speedLevel*0.1){
      this.game.particles.push(new Particle(this.x-14,this.y+rand(-3,3),-rand(120,200),rand(-10,10),0.22,'#ff5a3c',rand(1,3)));
    }
  }
  shoot(){
    const g=this.game;
    const sx=this.x+20, sy=this.y;
    Audio2.shoot();
    if(this.hasCannon){
      this.fireTimer=CFG.fireCooldown;
      const sp=CFG.bulletSpeed;
      // 散弹等级：1级3颗 2级5颗 3级7颗
      let angles;
      if(this.spreadLevel>=3){ angles=[0,-0.12,0.12,-0.24,0.24,-0.36,0.36]; }       // 7 路
      else if(this.spreadLevel===2){ angles=[0,-0.18,0.18,-0.36,0.36]; }              // 5 路
      else { angles=[0,-0.20,0.20]; }                                                 // 3 路
      for(const a of angles){
        g.addBullet(new Bullet(sx,sy,Math.cos(a)*sp,Math.sin(a)*sp,
          {w:6,h:6,dmg:1,color:COLORS.bullet,friendly:true}));
      }
    } else {
      this.fireTimer=CFG.fireCooldown;
      const sp=CFG.bulletSpeed;
      g.addBullet(new Bullet(sx,sy,sp,0,{w:7,h:7,dmg:1,color:COLORS.bullet,friendly:true}));
    }
  }
  // 激光等级颜色：1级蓝 2级橙 3级红
  laserColor(){
    if(this.laserLevel===1) return '#4db4ff';   // 蓝
    if(this.laserLevel===2) return '#ff9a3c';   // 橙
    return '#ff3a3a';                            // 红
  }
  // 激光等级伤害（dps）：1级 10 2级 20 3级 30
  laserDps(){
    if(this.laserLevel===1) return 10;
    if(this.laserLevel===2) return 20;
    return 30;
  }
  // 持续激光：每帧扫描光束路径上的目标并造成持续伤害
  updateLaser(dt){
    const g=this.game;
    const beamY=this.y;
    const startX=this.x+20;
    const endX=g.camX+W;
    const lv=this.laserLevel;
    const halfH=7 + lv*2;        // 等级越高光束越宽（1级9 2级11 3级13）
    const dps=this.laserDps();
    const col=this.laserColor();
    const dmg=dps*dt;
    for(const e of g.enemies){
      if(e.dead) continue;
      if(e.x < startX - e.w) continue;
      if(e.x > endX + e.w) continue;
      const eb=e.bounds();
      if(eb.y <= beamY+halfH && eb.y+eb.h >= beamY-halfH){
        e.takeDamage(dmg);
        if(Math.random()<0.35){
          spawnExplosion(g.particles, e.x, beamY, col, 2, 0.5);
        }
      }
    }
    if(g.boss && !g.boss.dead){
      const bb=g.boss.bounds();
      if(g.boss.x+bb.w/2 >= startX && g.boss.x-bb.w/2 <= endX){
        if(bb.y <= beamY+halfH && bb.y+bb.h >= beamY-halfH){
          g.boss.takeDamage(dmg, true); // 激光算核心弱点伤害
          if(Math.random()<0.4){
            spawnExplosion(g.particles, g.boss.x-30, beamY, col, 3, 0.7);
          }
        }
      }
    }
  }
  // 绘制持续激光射线
  drawLaser(ctx, camX){
    if(!this.laserActive) return;
    const sxStart=this.x+20-camX;
    const sxEnd=W;                          // 到屏幕右端
    const beamY=this.y;
    const lv=this.laserLevel;
    const col=this.laserColor();
    const pulse=1+Math.sin(this.laserT*16)*0.18;
    const halfW=(6 + lv)*pulse;   // 等级越高越宽（1级7 2级8 3级9）
    ctx.save();
    // 外光晕
    ctx.shadowBlur=18 + lv*6; ctx.shadowColor=col;
    const g=ctx.createLinearGradient(sxStart,0,sxEnd,0);
    g.addColorStop(0, col);
    g.addColorStop(0.3, col+'d9');   // ~85% 透明度
    g.addColorStop(1, col+'26');     // ~15% 透明度
    ctx.fillStyle=g;
    ctx.fillRect(sxStart, beamY-halfW, sxEnd-sxStart, halfW*2);
    // 内核白色亮线
    ctx.shadowBlur=0;
    const g2=ctx.createLinearGradient(sxStart,0,sxEnd,0);
    g2.addColorStop(0, '#fff');
    g2.addColorStop(0.5, 'rgba(255,255,255,0.7)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle=g2;
    ctx.fillRect(sxStart, beamY-halfW*0.25, sxEnd-sxStart, halfW*0.5);
    // 起点闪光
    ctx.shadowBlur=12; ctx.shadowColor='#fff';
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(sxStart, beamY, halfW*1.3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  fireMissiles(){
    const g=this.game;
    Audio2.missile();
    const sp=CFG.missileSpeed + (this.missileLevel-1)*60; // 每级加速60
    const count=this.missileLevel*2;                       // 每级2枚
    const target=g.findNearestEnemy(this.x+200,this.y);
    for(let i=0;i<count;i++){
      const offset=(i-(count-1)/2)*14;
      const vy=offset*3;
      g.addBullet(new Bullet(this.x,this.y+offset,sp,vy,{w:8,h:8,dmg:1,color:COLORS.missile,friendly:true,missile:true,target}));
    }
  }
  hurt(dmg=1){
    if(this.invincible>0) return false;
    if(this.shieldHits>0){
      // 护盾一次性吸收整发激光子弹（无论 dmg 多少），消耗 1 层护盾
      this.shieldHits--;
      this.shieldFlash=0.4;
      this.invincible=0.6;
      Audio2.hit();
      spawnExplosion(this.game.particles,this.x,this.y,COLORS.player,10,0.8);
      if(this.shieldHits===0){ this.abilities.delete('shield'); this.game.toast('护盾耗尽'); }
      else { this.game.toast('护盾抵挡 剩余 '+this.shieldHits+'/3'); }
      return true;
    }
    this.lives -= dmg;          // 支持 Boss 激光子弹等多次伤害（dmg=2 一次扣 2 滴血）
    this.invincible=CFG.invincibleTime;
    Audio2.hurt(); Audio2.explode();
    spawnExplosion(this.game.particles,this.x,this.y,COLORS.player,30,1.5);
    this.game.shake=0.4;
    if(this.lives<=0){ this.lives=0; this.alive=false; Audio2.playerDead(); this.game.onPlayerDead(); }
    return true;
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    if(this.invincible>0 && Math.floor(this.invincible*20)%2===0) return;
    ctx.save();
    ctx.translate(sx,this.y);
    const flame=12+Math.sin(this.engineFlick)*7;
    // ===== 双引擎尾焰：科幻等离子喷流 =====
    for(const oy of [-4,4]){
      // 外焰：等离子蓝光晕
      ctx.shadowBlur=14; ctx.shadowColor='#4db4ff';
      const fg=ctx.createLinearGradient(-22-flame,0,-12,0);
      fg.addColorStop(0,'rgba(77,180,255,0)');
      fg.addColorStop(0.5,'rgba(94,247,255,0.7)');
      fg.addColorStop(1,'#4db4ff');
      ctx.fillStyle=fg;
      ctx.beginPath();
      ctx.moveTo(-12,oy-2); ctx.lineTo(-22-flame,oy); ctx.lineTo(-12,oy+2);
      ctx.closePath(); ctx.fill();
      // 内核：白热
      ctx.shadowBlur=6; ctx.shadowColor='#5ef7ff';
      ctx.fillStyle='#bffcff';
      ctx.beginPath();
      ctx.moveTo(-12,oy-1); ctx.lineTo(-17-flame*0.5,oy); ctx.lineTo(-12,oy+1);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur=0;

    // ===== 机身：科幻流线型箭头（机头朝右） =====
    ctx.shadowBlur=12; ctx.shadowColor=COLORS.player;
    const bg=ctx.createLinearGradient(0,-6,0,6);
    bg.addColorStop(0,'#c8feff'); bg.addColorStop(0.35,'#5ef7ff'); bg.addColorStop(0.7,'#2bb6cc'); bg.addColorStop(1,'#0c4a5a');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(28,0);                     // 机头尖端
    ctx.quadraticCurveTo(22,-3, 12,-4);   // 机头上沿
    ctx.quadraticCurveTo(2,-5, -8,-4);    // 腰部
    ctx.quadraticCurveTo(-14,-3, -12,-1); // 尾部上
    ctx.lineTo(-12,1);
    ctx.quadraticCurveTo(-14,3, -8,4);    // 尾部下
    ctx.quadraticCurveTo(2,5, 12,4);
    ctx.quadraticCurveTo(22,3, 28,0);      // 回到机头
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // 机身上沿高光
    const hl=ctx.createLinearGradient(0,-5,0,0);
    hl.addColorStop(0,'rgba(255,255,255,0.8)'); hl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hl;
    ctx.beginPath();
    ctx.moveTo(22,-2); ctx.quadraticCurveTo(10,-4, -4,-4); ctx.lineTo(-10,-3);
    ctx.lineTo(-10,-2); ctx.quadraticCurveTo(8,-2, 20,-1);
    ctx.closePath(); ctx.fill();

    // ===== 后掠翼（科幻三角翼，上大下小） =====
    ctx.fillStyle=COLORS.playerWing;
    // 上翼（较大）
    ctx.beginPath();
    ctx.moveTo(2,-3);
    ctx.lineTo(-4,-4);
    ctx.lineTo(-20,-11);
    ctx.lineTo(-24,-7);
    ctx.lineTo(-16,-2);
    ctx.closePath(); ctx.fill();
    // 下翼（较小）
    ctx.beginPath();
    ctx.moveTo(2,3);
    ctx.lineTo(-4,4);
    ctx.lineTo(-16,8);
    ctx.lineTo(-19,5);
    ctx.lineTo(-14,2);
    ctx.closePath(); ctx.fill();
    // 翼上能量纹
    ctx.fillStyle='#7ffaff';
    ctx.shadowBlur=5; ctx.shadowColor='#5ef7ff';
    ctx.fillRect(-17,-9, 8, 1.2);
    ctx.fillRect(-15,6, 6, 1);
    ctx.shadowBlur=0;

    // ===== 驾驶舱：流线型透明罩 =====
    const dome=ctx.createLinearGradient(0,-5,0,0);
    dome.addColorStop(0,'rgba(255,255,255,0.85)');
    dome.addColorStop(0.6,'rgba(180,240,255,0.6)');
    dome.addColorStop(1,'rgba(120,200,230,0.3)');
    ctx.fillStyle=dome;
    ctx.beginPath();
    ctx.moveTo(2,-4);
    ctx.quadraticCurveTo(10,-9, 18,-3);
    ctx.quadraticCurveTo(16,-1, 8,-2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=0.8;
    ctx.beginPath();
    ctx.moveTo(2,-4); ctx.quadraticCurveTo(10,-9, 18,-3);
    ctx.stroke();
    // 驾驶舱高光
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.ellipse(9,-6, 2.5,0.9, -0.4, 0, Math.PI*2); ctx.fill();

    // ===== 机头核心发光体（能量推进器） =====
    ctx.fillStyle=COLORS.playerCore;
    ctx.shadowBlur=7; ctx.shadowColor='#fff';
    ctx.beginPath(); ctx.arc(22,0, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // ===== 速度升级指示灯（机身后部小灯） =====
    if(this.speedLevel>0){
      for(let i=0;i<this.speedLevel;i++){
        ctx.fillStyle='#ff5a3c';
        ctx.shadowBlur=3; ctx.shadowColor='#ff5a3c';
        ctx.fillRect(-10+i*2.5, -1, 1.5, 2);
      }
      ctx.shadowBlur=0;
    }
    ctx.restore();
    // 激光射线（在飞机之上绘制）
    this.drawLaser(ctx, camX);
    for(const w of this.wingmen) w.draw(ctx,camX);
    if(this.shieldHits>0){
      ctx.save();
      ctx.strokeStyle= this.shieldFlash>0 ? '#fff' : '#ffd24d';
      ctx.globalAlpha=0.4+0.3*Math.sin(this.engineFlick)+(this.shieldFlash>0?0.3:0);
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(sx,this.y,28,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#ffd24d';
      for(let i=0;i<this.shieldHits;i++){
        ctx.beginPath(); ctx.arc(sx-8+i*16, this.y-36, 2.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
  }
}

/* ------------------------------ 敌人 ------------------------------ */
class Enemy{
  constructor(type,x,y,game){
    this.type=type; this.x=x; this.y=y; this.game=game;
    this.dead=false; this.hitFlash=0; this.t=0;
    this.fireTimer=rand(0.6,1.6);
    this.dropCrystal = Math.random() < 0.25;
    this.setup();
    // HP 系统：以关卡 enemyHp 为基准（1/3/5），按敌人 hpClass 加权（小=1x，中=2x，大=3x）
    // 难度调整：困难 hpMul=1.5，简单/普通 hpMul=1.0
    const baseHp = (game.level && game.level.enemyHp) ? game.level.enemyHp : 1;
    const hpClass = this.hpClass || 1;   // 默认小敌人 1x
    const hpMul = DIFFICULTY[game.difficulty||'normal'].hpMul;
    this.maxHp = Math.max(1, Math.round(baseHp * hpClass * hpMul));
    this.hp = this.maxHp;
  }
  setup(){
    // hpClass: 1=小(1x基准), 2=中(2x), 3=大(3x)。子弹伤害=1，故 1x=1击杀，2x=2击杀，3x=3击杀
    switch(this.type){
      case 'asteroid_s': this.w=24;this.h=24;this.hpClass=1;this.score=80;this.vx=-70;this.vy=rand(-20,20);this.spin=rand(-2,2);this.ang=0;this.shape=this.genRock();break;
      case 'asteroid_m': this.w=40;this.h=40;this.hpClass=2;this.score=180;this.vx=-55;this.vy=rand(-15,15);this.spin=rand(-1.5,1.5);this.ang=0;this.shape=this.genRock();break;
      case 'asteroid_l': this.w=64;this.h=64;this.hpClass=3;this.score=350;this.vx=-40;this.vy=rand(-10,10);this.spin=rand(-1,1);this.ang=0;this.shape=this.genRock();break;
      case 'miner':      this.w=30;this.h=26;this.hpClass=2;this.score=250;this.vx=-80;this.vy=0;this.baseY=this.y;break;
      case 'comet':      this.w=28;this.h=16;this.hpClass=1;this.score=200;this.vx=-160;this.vy=rand(-40,40);this.spin=0;this.ang=Math.atan2(this.vy,this.vx);break;
      case 'sentinel':   this.w=34;this.h=34;this.hpClass=2;this.score=300;this.vx=-45;this.vy=0;break;
      case 'turret':     this.w=32;this.h=28;this.hpClass=2;this.score=300;this.vx=-50;this.vy=0;break;
      case 'drone_swarm':this.w=22;this.h=22;this.hpClass=1;this.score=120;this.vx=-100;this.vy=0;this.baseY=this.y;break;
      case 'laser_node': this.w=30;this.h=30;this.hpClass=2;this.score=280;this.vx=-45;this.vy=0;this.charge=0;break;
      case 'saw':        this.w=44;this.h=44;this.hpClass=3;this.score=280;this.vx=-65;this.vy=0;this.spin=4;this.ang=0;break;
      case 'shield_bot': this.w=32;this.h=30;this.hpClass=2;this.score=320;this.vx=-55;this.vy=0;this.shieldHp=4;this.baseY=this.y;break;
      case 'core_cell':  this.w=28;this.h=28;this.hpClass=2;this.score=200;this.vx=-60;this.vy=0;this.baseY=this.y;break;
      case 'defender':   this.w=30;this.h=30;this.hpClass=3;this.score=350;this.vx=-70;this.vy=0;this.baseY=this.y;break;
      case 'seeker':     this.w=24;this.h=24;this.hpClass=1;this.score=220;this.vx=-90;this.vy=0;break;
      case 'splitter':   this.w=40;this.h=40;this.hpClass=2;this.score=300;this.vx=-55;this.vy=0;break;
      case 'portal':     this.w=36;this.h=36;this.hpClass=3;this.score=400;this.vx=-40;this.vy=0;this.spawnTimer=2;this.baseY=this.y;break;
      // 第四关·星海：4种火敌人
      case 'fire_beast': this.w=40;this.h=32;this.hpClass=2;this.score=320;this.vx=-70;this.vy=0;this.baseY=this.y;break;
      case 'fire_snake': this.w=34;this.h=34;this.hpClass=1;this.score=300;this.vx=-90;this.vy=0;this.baseY=this.y;break;
      case 'fire_bird':  this.w=30;this.h=24;this.hpClass=1;this.score=260;this.vx=-140;this.vy=rand(-30,30);break;
      case 'fire_ball':  this.w=28;this.h=28;this.hpClass=1;this.score=240;this.vx=-60;this.vy=0;this.baseY=this.y;break;
      // 第五关·β星人墓穴：变异外星人 + 偷袭者
      case 'mutant_grunt': this.w=32;this.h=36;this.hpClass=2;this.score=280;this.vx=-65;this.vy=0;this.baseY=this.y;break;
      case 'mutant_brute': this.w=44;this.h=48;this.hpClass=3;this.score=450;this.vx=-50;this.vy=0;this.baseY=this.y;break;
      case 'mutant_crawler': this.w=26;this.h=20;this.hpClass=1;this.score=200;this.vx=-95;this.vy=0;this.baseY=this.y;break;
      case 'ambusher': this.w=30;this.h=30;this.hpClass=2;this.score=380;this.vx=-30;this.vy=0;break;
      // 第六关·逃脱要塞：爆炸碎片 + 碎片发射器
      case 'debris':     this.w=30;this.h=30;this.hpClass=1;this.score=180;this.vx=-110;this.vy=rand(-40,40);this.spin=rand(-4,4);this.ang=0;this.shape=this.genRock();this.explodeOnDeath=true;break; // 爆炸碎片：死后散弹
      case 'debris_big': this.w=52;this.h=52;this.hpClass=2;this.score=300;this.vx=-75;this.vy=rand(-20,20);this.spin=rand(-2,2);this.ang=0;this.shape=this.genRock();this.explodeOnDeath=true;break; // 大碎片：死后散弹更密
      case 'ruin_core':  this.w=36;this.h=36;this.hpClass=3;this.score=400;this.vx=-50;this.vy=0;this.fireTimer=1.5;this.baseY=this.y;break; // 废墟核心：发射碎片
    }
  }
  genRock(){
    const pts=[]; const n=randi(7,10);
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; const r=rand(0.7,1); pts.push([Math.cos(a)*r,Math.sin(a)*r]); }
    return pts;
  }
  bounds(){ return {x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}; }
  update(dt){
    this.t+=dt;
    if(this.hitFlash>0) this.hitFlash-=dt;
    switch(this.type){
      case 'asteroid_s': case 'asteroid_m': case 'asteroid_l':
        this.x+=this.vx*dt; this.y+=this.vy*dt; this.ang+=this.spin*dt;
        if(this.y<20||this.y>H-20) this.vy*=-1;
        break;
      case 'miner':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*2)*30;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=1.4; this.shootAtPlayer(); }
        break;
      case 'turret':
        this.x+=this.vx*dt;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=1.5; this.shootFan(3,0.3); }
        break;
      case 'drone_swarm':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*4+this.x*0.02)*20;
        break;
      case 'laser_node':
        this.x+=this.vx*dt;
        this.charge+=dt;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=2.0; this.shootAtPlayer(); }
        break;
      case 'core_cell':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*2.5)*40;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=1.2; this.shootFan(3,0.25); }
        break;
      case 'defender':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*1.8)*50;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=1.0; this.shootAtPlayer(); }
        break;
      case 'seeker':
        this.x+=this.vx*dt;
        const dy=this.game.player.y-this.y;
        this.y += clamp(dy,-80,80)*dt;
        break;
      case 'fire_beast':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*3)*70;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=2.2; this.shootAtPlayer(); }
        break;
      case 'fire_snake':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*4+this.x*0.03)*45;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=1.6; this.shootFan(4,0.3); }
        break;
      case 'fire_bird':
