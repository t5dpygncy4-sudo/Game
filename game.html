        this.x+=this.vx*dt; this.y+=this.vy*dt;
        if(this.y<20||this.y>H-20) this.vy*=-1;
        break;
      case 'fire_ball':
        this.x+=this.vx*dt;
        const dyb=this.game.player.y-this.y;
        this.y += clamp(dyb,-60,60)*dt;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=3.0; this.shootAtPlayer(); }
        break;
      case 'mutant_grunt':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*2.2)*32;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=1.8; this.shootCorrosive(); }
        break;
      case 'mutant_brute':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*1.4)*22;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){ this.fireTimer=2.4; this.shootCorrosiveFan(3,0.32); }
        break;
      case 'mutant_crawler':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*6+this.x*0.04)*16;
        break;
      case 'ambusher': {
        // 偷袭者：进场后警告 → 锁定玩家Y → 高速冲撞
        if(this.ambushState===undefined){ this.ambushState=0; this.ambushTimer=0; }
        this.ambushTimer+=dt;
        if(this.ambushState===0){
          // 警告阶段：缓慢左移，锁定玩家Y做准备
          this.x+=this.vx*dt;
          const tY=this.game.player.y;
          this.y += clamp(tY-this.y,-40,40)*dt;
          if(this.ambushTimer>0.9){ this.ambushState=1; this.ambushTimer=0; this.targetY=this.game.player.y; this.dashDir=(this.game.player.x<this.x?-1:1); }
        } else if(this.ambushState===1){
          // 冲撞阶段：朝玩家位置高速直冲
          const dx=this.game.player.x-this.x;
          const sp=380;
          const m=Math.hypot(dx,this.targetY-this.y)||1;
          this.x+=(dx/m)*sp*dt;
          this.y+=((this.targetY-this.y)/m)*sp*dt;
          if(this.ambushTimer>1.4){ this.ambushState=2; this.vx=-120; }
        } else {
          // 撤退阶段：直线左移退出
          this.x+=this.vx*dt;
        }
        break;
      }
      // 第六关·逃脱要塞：爆炸碎片（直线飞行+旋转）+ 废墟核心（发射碎片）
      case 'debris':
      case 'debris_big':
        this.x+=this.vx*dt; this.y+=this.vy*dt;
        this.ang+=this.spin*dt;
        if(this.y<20||this.y>H-20) this.vy*=-1;
        break;
      case 'ruin_core':
        this.x+=this.vx*dt;
        this.y=this.baseY+Math.sin(this.t*1.5)*30;
        this.fireTimer-=dt*this.game.fireScale();
        if(this.fireTimer<=0 && this.x<this.game.camX+W){
          this.fireTimer=2.0;
          // 发射碎片（召唤 debris 敌人）
          this.game.enemies.push(new Enemy('debris', this.x-20, this.y+rand(-30,30), this.game));
        }
        break;
    }
    if(this.x<this.game.camX-80) this.dead=true;
  }
  shootCorrosive(){
    const p=this.game.player;
    const dx=p.x-this.x, dy=p.y-this.y;
    const m=Math.hypot(dx,dy)||1;
    const sp=CFG.enemyBulletSpeed*0.9;
    this.game.bullets.push(new Bullet(this.x,this.y,dx/m*sp,dy/m*sp,
      {w:11,h:11,dmg:1,color:COLORS.corrosive,friendly:false,corrosive:true}));
  }
  shootCorrosiveFan(n,spread){
    const sp=CFG.enemyBulletSpeed*0.85;
    const base=Math.PI;
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*spread;
      this.game.bullets.push(new Bullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:11,h:11,dmg:1,color:COLORS.corrosive,friendly:false,corrosive:true}));
    }
  }
  shootAtPlayer(){
    const p=this.game.player;
    const dx=p.x-this.x, dy=p.y-this.y;
    const m=Math.hypot(dx,dy)||1;
    const sp=CFG.enemyBulletSpeed;
    this.game.bullets.push(new Bullet(this.x,this.y,dx/m*sp,dy/m*sp,
      {w:8,h:8,dmg:1,color:COLORS.enemyBullet,friendly:false}));
  }
  shootFan(n,spread){
    const sp=CFG.enemyBulletSpeed;
    const base=Math.PI;
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*spread;
      this.game.bullets.push(new Bullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:8,h:8,dmg:1,color:COLORS.enemyBullet,friendly:false}));
    }
  }
  takeDamage(dmg){
    this.hp-=dmg; this.hitFlash=0.08;
    if(this.hp<=0) this.die();
  }
  die(){
    this.dead=true;
    this.game.score+=this.score; this.game.kills++;
    const isBig = this.type==='asteroid_l'||this.type==='defender'||this.type==='mutant_brute'||this.type==='debris_big';
    spawnExplosion(this.game.particles,this.x,this.y,COLORS.enemy,isBig?22:12,isBig?1.4:1);
    if(isBig) Audio2.bigExplode(); else Audio2.explode();
    if(this.dropCrystal) this.game.spawnCrystal(this.x,this.y);
    if(isBig && Math.random()<0.15) this.game.spawnLifeDrop(this.x,this.y);
    // 稀有掉落：清屏晶体（5% 概率，大敌人额外+3%）
    if(Math.random() < (isBig?0.08:0.05)) this.game.spawnBombCrystal(this.x,this.y);
    // 第六关·爆炸碎片：死后向四周散射能量子弹
    if(this.explodeOnDeath){
      const n = this.type==='debris_big' ? 10 : 6;
      const sp = CFG.enemyBulletSpeed*0.9;
      const off = Math.random()*Math.PI*2;
      for(let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2+off;
        this.game.bullets.push(new Bullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
          {w:8,h:8,dmg:1,color:'#ff5a3c',friendly:false}));
      }
      spawnExplosion(this.game.particles,this.x,this.y,'#ff5a3c',16,1.5);
    }
  }
  color(){
    return {asteroid_s:'#7a5a3a',asteroid_m:'#7a5a3a',asteroid_l:'#7a5a3a',miner:'#ff8a3c',
            turret:'#9a6dff',drone_swarm:'#a06aff',laser_node:'#6a9aff',
            core_cell:'#ff3a6d',defender:'#ff5d7a',seeker:'#ffaa3c',
            fire_beast:'#ff5a1a',fire_snake:'#ff9a3c',fire_bird:'#ffd24d',fire_ball:'#ff3a1a',
            mutant_grunt:'#8ace3a',mutant_brute:'#5a8a2a',mutant_crawler:'#a0d050',ambusher:'#b03aff',
            debris:'#8a7a6a',debris_big:'#6a5a4a',ruin_core:'#9a3a6a'}[this.type]||COLORS.enemy;
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    ctx.translate(sx,this.y);
    const flash=this.hitFlash>0;
    const main=flash?'#fff':this.color();
    ctx.shadowBlur=10; ctx.shadowColor=main;
    switch(this.type){
      case 'asteroid_s': case 'asteroid_m': case 'asteroid_l':{
        ctx.rotate(this.ang);
        const r=this.w/2;
        // 渐变岩石表面：左暗右亮（模拟光照）
        const rg=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
        if(!flash){ rg.addColorStop(0,'#9a7a5a'); rg.addColorStop(0.6,'#6a4a2a'); rg.addColorStop(1,'#2a1a0a'); }
        else { rg.addColorStop(0,'#fff'); rg.addColorStop(1,'#aaa'); }
        ctx.fillStyle=rg;
        ctx.beginPath();
        this.shape.forEach((p,i)=>{ const x=p[0]*r,y=p[1]*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
        ctx.closePath(); ctx.fill();
        // 多个撞击坑（带阴影）
        ctx.shadowBlur=0;
        const craters=[[-r*0.3,-r*0.2,r*0.28],[r*0.22,r*0.3,r*0.18],[-r*0.1,r*0.35,r*0.12],[r*0.35,-r*0.25,r*0.1]];
        for(const [cx,cy,cr] of craters){
          ctx.fillStyle='#2a1a0a';
          ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#5a4a3a';
          ctx.beginPath(); ctx.arc(cx-cr*0.3,cy-cr*0.3,cr*0.6,0,Math.PI*2); ctx.fill();
        }
        // 右上高光（光照点）
        ctx.fillStyle='rgba(255,230,200,0.4)';
        ctx.beginPath(); ctx.arc(r*0.4,-r*0.4,r*0.18,0,Math.PI*2); ctx.fill();
        break;
      }
      case 'miner': {
        // 采矿无人机：椭圆机身 + 舷窗 + 旋转钻头 + 支架
        ctx.fillStyle=flash?'#fff':'#5a3a2a';
        ctx.beginPath(); ctx.ellipse(0,0,14,11,0,0,Math.PI*2); ctx.fill();
        // 金属高光
        const mg=ctx.createLinearGradient(0,-11,0,11);
        mg.addColorStop(0,'#8a5a3a'); mg.addColorStop(0.5,'#5a3a2a'); mg.addColorStop(1,'#2a1a0a');
        ctx.fillStyle=flash?'#fff':mg;
        ctx.beginPath(); ctx.ellipse(0,0,13,10,0,0,Math.PI*2); ctx.fill();
        // 舷窗
        ctx.shadowBlur=8; ctx.shadowColor='#ffcc33';
        ctx.fillStyle=flash?'#fff':'#ffd24d';
        ctx.beginPath(); ctx.arc(-2,0,4,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.arc(-3,-1,1.5,0,Math.PI*2); ctx.fill();
        // 旋转钻头
        ctx.save();
        ctx.translate(11,0); ctx.rotate(this.t*12);
        ctx.fillStyle='#aaa';
        for(let i=0;i<3;i++){
          ctx.rotate(Math.PI*2/3);
          ctx.fillStyle=i===0?'#ddd':'#888';
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(5,-2); ctx.lineTo(7,0); ctx.lineTo(5,2); ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle='#444'; ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
        ctx.restore();
        // 支架
        ctx.fillStyle='#3a2a1a'; ctx.fillRect(-13,-13,4,5); ctx.fillRect(-13,8,4,5);
        break;
      }
      case 'turret': {
        // 炮台：底座 + 旋转炮管 + 双侧装甲 + 核心灯
        // 底座
        ctx.fillStyle=flash?'#fff':'#3a2a5a';
        ctx.beginPath();
        ctx.moveTo(-16,12); ctx.lineTo(-14,-8); ctx.lineTo(14,-8); ctx.lineTo(16,12);
        ctx.closePath(); ctx.fill();
        // 主体装甲（带渐变）
        const tg=ctx.createLinearGradient(0,-12,0,12);
        if(!flash){ tg.addColorStop(0,'#9a6dff'); tg.addColorStop(0.5,'#6a4dbf'); tg.addColorStop(1,'#3a2a5a'); }
        else { tg.addColorStop(0,'#fff'); tg.addColorStop(1,'#ccc'); }
        ctx.fillStyle=tg;
        ctx.fillRect(-14,-10,28,16);
        // 侧装甲块
        ctx.fillStyle=flash?'#fff':'#5a3a8a';
        ctx.fillRect(-18,-6,6,12); ctx.fillRect(12,-6,6,12);
        // 炮管（朝向玩家方向）
        ctx.save();
        ctx.translate(0,2);
        const p=this.game.player;
        const ang=Math.atan2(p.y-this.y, p.x-this.x);
        ctx.rotate(ang);
        ctx.fillStyle=flash?'#fff':'#2a1a4a';
        ctx.fillRect(0,-3,22,6);
        ctx.fillStyle='#ffcc33';
        ctx.fillRect(18,-4,4,8);
        ctx.restore();
        // 核心灯
        ctx.shadowBlur=8; ctx.shadowColor='#ffcc33';
        ctx.fillStyle=flash?'#fff':'#ffd24d';
        ctx.beginPath(); ctx.arc(0,-2,4,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(-1,-3,1.5,0,Math.PI*2); ctx.fill();
        break;
      }
      case 'drone_swarm': {
        // 无人机群：六边形机身 + 中央扫描眼 + 旋翼
        ctx.fillStyle=flash?'#fff':'#7a4adf';
        ctx.beginPath();
        for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const r=9; const x=Math.cos(a)*r,y=Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.closePath(); ctx.fill();
        // 装甲条
        ctx.fillStyle=flash?'#fff':'#5a2abf';
        ctx.fillRect(-7,-2,14,4);
        // 旋翼（旋转）
        ctx.shadowBlur=0;
        ctx.strokeStyle='rgba(180,180,255,0.6)';
        ctx.lineWidth=1.5;
        const ra=this.t*30;
        ctx.beginPath(); ctx.moveTo(-9,-9); ctx.lineTo(-9+Math.cos(ra)*4,-9+Math.sin(ra)*4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(9,-9); ctx.lineTo(9+Math.cos(ra+2)*4,-9+Math.sin(ra+2)*4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-9,9); ctx.lineTo(-9+Math.cos(ra+4)*4,9+Math.sin(ra+4)*4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(9,9); ctx.lineTo(9+Math.cos(ra+1)*4,9+Math.sin(ra+1)*4); ctx.stroke();
        // 中央扫描眼
        ctx.shadowBlur=6; ctx.shadowColor='#ff4d8d';
        ctx.fillStyle=flash?'#fff':(Math.floor(this.t*4)%2?'#ff4d8d':'#4db4ff');
        ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
        break;
      }
      case 'laser_node': {
        // 激光节点：菱形水晶 + 充能环 + 闪烁核心
        ctx.fillStyle=flash?'#fff':'#4a7adf';
        ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(15,0); ctx.lineTo(0,15); ctx.lineTo(-15,0);
        ctx.closePath(); ctx.fill();
        // 水晶切面渐变
        const lg=ctx.createLinearGradient(-15,-15,15,15);
        if(!flash){ lg.addColorStop(0,'#8aaeff'); lg.addColorStop(0.5,'#4a7adf'); lg.addColorStop(1,'#2a4a8a'); }
        else { lg.addColorStop(0,'#fff'); lg.addColorStop(1,'#aaf'); }
        ctx.fillStyle=lg;
        ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(13,0); ctx.lineTo(0,13); ctx.lineTo(-13,0);
        ctx.closePath(); ctx.fill();
        // 充能环
        ctx.shadowBlur=0;
        ctx.strokeStyle='rgba(120,180,255,'+(0.4+Math.sin(this.t*8)*0.3)+')';
        ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(0,0,10+Math.sin(this.t*8)*2,0,Math.PI*2); ctx.stroke();
        // 闪烁核心
        const coreC=this.charge%1<0.5?'#ff4d8d':'#4db4ff';
        ctx.shadowBlur=10; ctx.shadowColor=coreC;
        ctx.fillStyle=flash?'#fff':coreC;
        const cp=1+Math.sin(this.t*10)*0.3;
        ctx.beginPath(); ctx.arc(0,0,4*cp,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(0,0,1.5,0,Math.PI*2); ctx.fill();
        break;
      }
      case 'core_cell': {
        // 核心细胞：六边形外壳 + 脉动粉色核心 + 能量丝
        ctx.fillStyle=flash?'#fff':'#5a1a3a';
        ctx.beginPath();
        for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const x=Math.cos(a)*14,y=Math.sin(a)*14; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.closePath(); ctx.fill();
        // 外壳渐变
        const cg=ctx.createRadialGradient(0,0,2,0,0,14);
        if(!flash){ cg.addColorStop(0,'#ff5a8d'); cg.addColorStop(0.6,'#ff3a6d'); cg.addColorStop(1,'#8a1a3a'); }
        else { cg.addColorStop(0,'#fff'); cg.addColorStop(1,'#faa'); }
        ctx.fillStyle=cg;
        ctx.beginPath();
        for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const x=Math.cos(a)*13,y=Math.sin(a)*13; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.closePath(); ctx.fill();
        // 能量丝（向内辐射）
        ctx.shadowBlur=0;
        ctx.strokeStyle='rgba(255,255,255,0.4)';
        ctx.lineWidth=1;
        for(let i=0;i<6;i++){
          const a=i/6*Math.PI*2+this.t*2;
          ctx.beginPath(); ctx.moveTo(Math.cos(a)*11,Math.sin(a)*11); ctx.lineTo(Math.cos(a)*5,Math.sin(a)*5); ctx.stroke();
        }
        // 脉动核心
        const pulse=1+Math.sin(this.t*6)*0.3;
        ctx.shadowBlur=12; ctx.shadowColor='#ff3a6d';
        ctx.fillStyle=flash?'#fff':'#fff';
        ctx.beginPath(); ctx.arc(0,0,5*pulse,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ff3a6d';
        ctx.beginPath(); ctx.arc(0,0,3*pulse,0,Math.PI*2); ctx.fill();
        break;
      }
      case 'defender': {
        // 守卫者：箭头形战机 + 双引擎 + 武器舱 + 护甲
        // 主体（带渐变）
        const dg=ctx.createLinearGradient(-14,0,14,0);
        if(!flash){ dg.addColorStop(0,'#9a3a5a'); dg.addColorStop(0.5,'#ff5d7a'); dg.addColorStop(1,'#ffaacc'); }
        else { dg.addColorStop(0,'#fff'); dg.addColorStop(1,'#fcc'); }
        ctx.fillStyle=dg;
        ctx.beginPath(); ctx.moveTo(-16,-12); ctx.lineTo(14,-8); ctx.lineTo(18,0); ctx.lineTo(14,8); ctx.lineTo(-16,12); ctx.lineTo(-12,0);
        ctx.closePath(); ctx.fill();
        // 中央武器舱
        ctx.fillStyle=flash?'#fff':'#5a1a3a';
        ctx.fillRect(-4,-5,12,10);
        // 红色核心
        ctx.shadowBlur=8; ctx.shadowColor='#ff3a6d';
        ctx.fillStyle=flash?'#fff':'#ff3a6d';
        const dp=1+Math.sin(this.t*5)*0.2;
        ctx.beginPath(); ctx.arc(2,0,3*dp,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // 双侧尾翼（紫色）
        ctx.fillStyle=flash?'#fff':'#9a4dff';
        ctx.beginPath(); ctx.moveTo(-12,-10); ctx.lineTo(-18,-14); ctx.lineTo(-14,-4); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-12,10); ctx.lineTo(-18,14); ctx.lineTo(-14,4); ctx.closePath(); ctx.fill();
        // 引擎尾焰
        const flame=4+Math.sin(this.t*20)*2;
        ctx.fillStyle='rgba(154,77,255,0.7)';
        ctx.beginPath(); ctx.moveTo(-16,-3); ctx.lineTo(-22-flame,-1); ctx.lineTo(-22-flame,1); ctx.lineTo(-16,3); ctx.closePath(); ctx.fill();
        break;
      }
      case 'seeker': {
        // 追踪者：导弹形 + 大眼睛 + 尾焰
        ctx.fillStyle=flash?'#fff':'#ff8a3c';
        ctx.beginPath(); ctx.moveTo(-12,-8); ctx.lineTo(8,-6); ctx.lineTo(14,0); ctx.lineTo(8,6); ctx.lineTo(-12,8); ctx.lineTo(-14,0);
        ctx.closePath(); ctx.fill();
        // 弹体渐变
        const sg=ctx.createLinearGradient(0,-8,0,8);
        if(!flash){ sg.addColorStop(0,'#ffd24d'); sg.addColorStop(0.5,'#ff8a3c'); sg.addColorStop(1,'#aa3a0a'); }
        else { sg.addColorStop(0,'#fff'); sg.addColorStop(1,'#fca'); }
        ctx.fillStyle=sg;
        ctx.beginPath(); ctx.moveTo(-10,-6); ctx.lineTo(6,-5); ctx.lineTo(12,0); ctx.lineTo(6,5); ctx.lineTo(-10,6); ctx.lineTo(-12,0);
        ctx.closePath(); ctx.fill();
        // 大追踪眼
        ctx.shadowBlur=10; ctx.shadowColor='#fff';
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(4,0,3.5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle='#0a0';
        ctx.beginPath(); ctx.arc(5,0,2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(6,0,1,0,Math.PI*2); ctx.fill();
        // 尾焰
        const sf=5+Math.sin(this.t*25)*2;
        ctx.fillStyle='rgba(255,154,60,0.8)';
        ctx.beginPath(); ctx.moveTo(-12,-3); ctx.lineTo(-18-sf,0); ctx.lineTo(-12,3); ctx.closePath(); ctx.fill();
        break;
      }
      case 'fire_beast': {
        // 火兽：兽形身躯 + 头部 + 双眼 + 火焰鬃毛 + 利爪
        // 主体（兽身渐变）
        const bg=ctx.createLinearGradient(-18,0,18,0);
        if(!flash){ bg.addColorStop(0,'#aa1a0a'); bg.addColorStop(0.5,'#ff5a1a'); bg.addColorStop(1,'#ffd24d'); }
        else { bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#fda'); }
        ctx.fillStyle=bg;
        ctx.beginPath(); ctx.moveTo(-18,-12); ctx.lineTo(-10,-14); ctx.lineTo(8,-10); ctx.lineTo(20,-4); ctx.lineTo(20,4); ctx.lineTo(8,10); ctx.lineTo(-10,14); ctx.lineTo(-18,12); ctx.lineTo(-14,0);
        ctx.closePath(); ctx.fill();
        // 火焰鬃毛（背部跳动）
        ctx.fillStyle='rgba(255,210,77,'+(0.7+Math.sin(this.t*8)*0.2)+')';
        for(let i=-2;i<=2;i++){
          const fh=8+Math.sin(this.t*10+i)*4;
          ctx.beginPath(); ctx.moveTo(i*6-3,-10); ctx.lineTo(i*6,-14-fh); ctx.lineTo(i*6+3,-10); ctx.closePath(); ctx.fill();
        }
        // 头部
        ctx.fillStyle=flash?'#fff':'#ff7a1a';
        ctx.beginPath(); ctx.arc(14,0,7,0,Math.PI*2); ctx.fill();
        // 双眼
        ctx.shadowBlur=8; ctx.shadowColor='#fff';
        ctx.fillStyle=flash?'#fff':'#ffd24d';
        ctx.beginPath(); ctx.arc(16,-3,2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(16,3,2,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(17,-3,1,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(17,3,1,0,Math.PI*2); ctx.fill();
        // 利爪
        ctx.fillStyle='#ff3a1a';
        ctx.beginPath(); ctx.moveTo(-16,-4); ctx.lineTo(-22,-6); ctx.lineTo(-16,-2); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-16,4); ctx.lineTo(-22,6); ctx.lineTo(-16,2); ctx.closePath(); ctx.fill();
        break;
      }
      case 'fire_snake': {
        // 火蛇：蛇身分段 + 鳞片 + 蛇头 + 信子
        ctx.rotate(Math.sin(this.t*4)*0.25);
        // 蛇身（多段椭圆）
        for(let i=-16;i<=16;i+=4){
          const y=Math.sin((i+this.t*40)*0.3)*6;
          const g=ctx.createLinearGradient(0,y-5,0,y+5);
          if(!flash){ g.addColorStop(0,'#ffd24d'); g.addColorStop(0.5,'#ff9a3c'); g.addColorStop(1,'#aa3a0a'); }
          else { g.addColorStop(0,'#fff'); g.addColorStop(1,'#fca'); }
          ctx.fillStyle=g;
          ctx.beginPath(); ctx.ellipse(i,y,3,5,0,0,Math.PI*2); ctx.fill();
        }
        // 蛇头
        ctx.fillStyle=flash?'#fff':'#ff5a1a';
        ctx.beginPath(); ctx.arc(16,0,6,0,Math.PI*2); ctx.fill();
        // 眼
        ctx.fillStyle=flash?'#fff':'#ff0';
        ctx.beginPath(); ctx.arc(18,-2,1.5,0,Math.PI*2); ctx.fill();
        // 信子（吐出）
        const tw=Math.sin(this.t*8);
        if(tw>0){
          ctx.strokeStyle='#ff3a6d'; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(26+tw*2,-2); ctx.moveTo(22,0); ctx.lineTo(26+tw*2,2); ctx.stroke();
        }
        break;
      }
      case 'fire_bird': {
        // 火鸟：菱形身 + 振翅 + 尖喙 + 尾羽
        const wing=Math.sin(this.t*12)*8;
        // 翅膀
        ctx.fillStyle=flash?'#fff':'#ff5a1a';
        ctx.beginPath(); ctx.moveTo(-4,-2); ctx.lineTo(-16,-12-wing); ctx.lineTo(-10,-2); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-4,2); ctx.lineTo(-16,12+wing); ctx.lineTo(-10,2); ctx.closePath(); ctx.fill();
        // 身体（渐变）
        const bg=ctx.createLinearGradient(-14,0,14,0);
        if(!flash){ bg.addColorStop(0,'#ff5a1a'); bg.addColorStop(0.5,'#ffd24d'); bg.addColorStop(1,'#fff8d0'); }
        else { bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#fff'); }
        ctx.fillStyle=bg;
        ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-2,-9); ctx.lineTo(12,-3); ctx.lineTo(16,0); ctx.lineTo(12,3); ctx.lineTo(-2,9);
        ctx.closePath(); ctx.fill();
        // 尖喙
        ctx.fillStyle=flash?'#fff':'#aa3a0a';
        ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(22,-1); ctx.lineTo(22,1); ctx.closePath(); ctx.fill();
        // 眼
        ctx.shadowBlur=6; ctx.shadowColor='#000';
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(6,-2,1.5,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // 尾羽
        ctx.fillStyle=flash?'#fff':'rgba(255,154,60,0.7)';
        ctx.beginPath(); ctx.moveTo(-14,-3); ctx.lineTo(-20,-6); ctx.lineTo(-18,0); ctx.lineTo(-20,6); ctx.lineTo(-14,3); ctx.closePath(); ctx.fill();
        break;
      }
      case 'fire_ball': {
        // 火球：脉动球 + 火焰光晕 + 高光 + 拖尾火星
        const fbPulse=1+Math.sin(this.t*6)*0.18;
        ctx.scale(fbPulse,fbPulse);
        // 外层火焰光晕
        ctx.shadowBlur=20; ctx.shadowColor='#ff5a1a';
        const og=ctx.createRadialGradient(0,0,8,0,0,18);
        og.addColorStop(0,'rgba(255,210,77,0.8)'); og.addColorStop(1,'rgba(255,90,26,0)');
        ctx.fillStyle=og;
        ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
        // 主球
        const fbg=ctx.createRadialGradient(-3,-3,0,0,0,14);
        fbg.addColorStop(0,'#fff8d0'); fbg.addColorStop(0.4,'#ffd24d'); fbg.addColorStop(0.8,'#ff5a1a'); fbg.addColorStop(1,'#aa1a0a');
        ctx.fillStyle=fbg;
        ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
        // 高光点
        ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(-3,-3,3,0,Math.PI*2); ctx.fill();
        // 表面火星（旋转）
        for(let i=0;i<3;i++){
          const a=this.t*3+i*Math.PI*2/3;
          ctx.fillStyle='rgba(255,210,77,0.6)';
          ctx.beginPath(); ctx.arc(Math.cos(a)*7,Math.sin(a)*7,1.5,0,Math.PI*2); ctx.fill();
        }
        break;
      }
      case 'mutant_grunt': {
        // 变异兵：人形身躯 + 大头 + 触手 + 腐蚀液口
        const sw=Math.sin(this.t*5)*2;
        // 身躯
        const bg=ctx.createLinearGradient(0,-16,0,16);
        if(!flash){ bg.addColorStop(0,'#a0e050'); bg.addColorStop(0.5,'#5a8a2a'); bg.addColorStop(1,'#2a4a0a'); }
        else { bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#afa'); }
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.moveTo(-10,14); ctx.lineTo(-12,-4); ctx.lineTo(-8,-10); ctx.lineTo(-2,-14);
        ctx.lineTo(4,-14); ctx.lineTo(10,-10); ctx.lineTo(12,-4); ctx.lineTo(10,14);
        ctx.lineTo(6,16); ctx.lineTo(-6,16);
        ctx.closePath(); ctx.fill();
        // 大头
        ctx.fillStyle=flash?'#fff':'#7ace3a';
        ctx.beginPath(); ctx.arc(0,-12,8,0,Math.PI*2); ctx.fill();
        // 触手（头部两侧摆动）
        ctx.strokeStyle=flash?'#fff':'#5a8a2a'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(-6,-14); ctx.quadraticCurveTo(-12,-18+sw,-14,-22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(6,-14); ctx.quadraticCurveTo(12,-18-sw,14,-22); ctx.stroke();
        // 双眼（发光红）
        ctx.shadowBlur=8; ctx.shadowColor='#f00';
        ctx.fillStyle=flash?'#fff':'#ff2020';
        ctx.beginPath(); ctx.arc(-3,-13,1.8,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3,-13,1.8,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // 腐蚀液口（流淌绿液）
        ctx.shadowBlur=6; ctx.shadowColor=COLORS.corrosive;
        ctx.fillStyle=flash?'#fff':COLORS.corrosive;
        ctx.beginPath(); ctx.arc(0,-7,2.5,0,Math.PI*2); ctx.fill();
        // 滴落的液滴
        ctx.fillStyle='rgba(122,255,58,0.6)';
        ctx.beginPath(); ctx.arc(0,-3+sw,1.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0,2-sw*0.5,1,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // 四肢
        ctx.fillStyle=flash?'#fff':'#4a6a1a';
        ctx.fillRect(-12,0,4,12); ctx.fillRect(8,0,4,12);
        break;
      }
      case 'mutant_brute': {
        // 变异巨兽：巨大身躯 + 多眼 + 巨口 + 双臂 + 脊刺
        const sw=Math.sin(this.t*3)*3;
        // 身躯（带渐变）
        const bg=ctx.createLinearGradient(0,-22,0,22);
        if(!flash){ bg.addColorStop(0,'#6a9a3a'); bg.addColorStop(0.5,'#3a6a1a'); bg.addColorStop(1,'#1a2a0a'); }
        else { bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#afa'); }
        ctx.fillStyle=bg;
        ctx.beginPath();
        ctx.moveTo(-18,20); ctx.lineTo(-20,-8); ctx.lineTo(-14,-18); ctx.lineTo(-4,-22);
        ctx.lineTo(6,-22); ctx.lineTo(16,-18); ctx.lineTo(20,-8); ctx.lineTo(18,20);
        ctx.lineTo(12,22); ctx.lineTo(-12,22);
        ctx.closePath(); ctx.fill();
        // 脊背尖刺
        ctx.fillStyle=flash?'#fff':'#2a4a0a';
        for(let i=-2;i<=2;i++){
          ctx.beginPath(); ctx.moveTo(i*6-3,-20); ctx.lineTo(i*6,-28-Math.sin(this.t*4+i)*3); ctx.lineTo(i*6+3,-20); ctx.closePath(); ctx.fill();
        }
        // 巨大头颅
        ctx.fillStyle=flash?'#fff':'#5a8a2a';
        ctx.beginPath(); ctx.arc(0,-16,12,0,Math.PI*2); ctx.fill();
        // 三只眼（发光）
        ctx.shadowBlur=10; ctx.shadowColor='#f00';
        ctx.fillStyle=flash?'#fff':'#ff3030';
        const ep=1+Math.sin(this.t*7)*0.2;
        ctx.beginPath(); ctx.arc(-5,-18,2*ep,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(5,-18,2*ep,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0,-22,2.5*ep,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // 巨口（漏腐蚀液）
        ctx.fillStyle=flash?'#fff':'#1a0a0a';
        ctx.beginPath(); ctx.ellipse(0,-10,8,4,0,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=6; ctx.shadowColor=COLORS.corrosive;
        ctx.fillStyle=flash?'#fff':COLORS.corrosive;
        ctx.beginPath(); ctx.ellipse(0,-9,6,2.5,0,0,Math.PI*2); ctx.fill();
        // 滴落液滴
        ctx.fillStyle='rgba(122,255,58,0.6)';
        ctx.beginPath(); ctx.arc(-3,-4+sw,1.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3,0-sw,1.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0,4,1,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // 双臂（粗壮）
        ctx.fillStyle=flash?'#fff':'#4a6a1a';
        ctx.fillRect(-20,-2,8,18); ctx.fillRect(12,-2,8,18);
        // 爪
        ctx.fillStyle=flash?'#fff':'#2a1a0a';
        for(let i=0;i<3;i++){
          ctx.beginPath(); ctx.moveTo(-20+i*3,16); ctx.lineTo(-22+i*3,22); ctx.lineTo(-18+i*3,22); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(12+i*3,16); ctx.lineTo(10+i*3,22); ctx.lineTo(14+i*3,22); ctx.closePath(); ctx.fill();
        }
        break;
      }
      case 'mutant_crawler': {
        // 爬行变异体：扁身体 + 多足 + 大眼
        const sw=Math.sin(this.t*8)*1.5;
        // 身体（椭圆扁)
        const cg=ctx.createRadialGradient(0,0,2,0,0,13);
        if(!flash){ cg.addColorStop(0,'#b0e050'); cg.addColorStop(0.6,'#7aa030'); cg.addColorStop(1,'#2a4a0a'); }
        else { cg.addColorStop(0,'#fff'); cg.addColorStop(1,'#afa'); }
        ctx.fillStyle=cg;
        ctx.beginPath(); ctx.ellipse(0,0,12,7,0,0,Math.PI*2); ctx.fill();
        // 多足（摆动）
        ctx.strokeStyle=flash?'#fff':'#3a5a1a'; ctx.lineWidth=1.5;
        for(let i=-2;i<=2;i++){
          const lx=i*4;
          const ph=Math.sin(this.t*10+i)*3;
          ctx.beginPath(); ctx.moveTo(lx,5); ctx.lineTo(lx-2,10+ph); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(lx,-5); ctx.lineTo(lx-2,-10-ph); ctx.stroke();
        }
        // 大眼
        ctx.shadowBlur=6; ctx.shadowColor='#f00';
        ctx.fillStyle=flash?'#fff':'#ff4040';
        ctx.beginPath(); ctx.arc(4,0,3+sw*0.3,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(5,0,1.5,0,Math.PI*2); ctx.fill();
        // 背部斑纹
        ctx.fillStyle='rgba(40,80,10,0.5)';
        ctx.beginPath(); ctx.arc(-4,0,2,0,Math.PI*2); ctx.fill();
        break;
      }
      case 'ambusher': {
        // 偷袭者：菱形体 + 鞭刺尾 + 警告时闪烁红圈
        // 警告圈（state 0 时显示）
        if(this.ambushState===0){
          ctx.shadowBlur=0;
          const wp=0.3+Math.sin(this.t*20)*0.3;
          ctx.strokeStyle='rgba(255,60,60,'+wp+')';
          ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
          ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.stroke();
        }
        // 身体（深紫，刺球形）
        const ag=ctx.createRadialGradient(0,0,2,0,0,14);
        if(!flash){ ag.addColorStop(0,'#d05aff'); ag.addColorStop(0.6,'#8030bf'); ag.addColorStop(1,'#3a0a5a'); }
        else { ag.addColorStop(0,'#fff'); ag.addColorStop(1,'#faf'); }
        ctx.fillStyle=ag;
        ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
        // 周身尖刺（旋转）
        ctx.save();
        ctx.rotate(this.t*4);
        ctx.fillStyle=flash?'#fff':'#b04aff';
        for(let i=0;i<8;i++){
          ctx.rotate(Math.PI/4);
          ctx.beginPath(); ctx.moveTo(11,0); ctx.lineTo(18,-3); ctx.lineTo(18,3); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        // 中央大眼（冲刺时变红）
        ctx.shadowBlur=10;
        const eyeC=this.ambushState===1?'#ff2020':'#fff';
        ctx.shadowColor=eyeC;
        ctx.fillStyle=flash?'#fff':eyeC;
        const ep=1+Math.sin(this.t*12)*0.2;
        ctx.beginPath(); ctx.arc(0,0,5*ep,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill();
        // 冲刺尾焰
        if(this.ambushState===1){
          ctx.fillStyle='rgba(255,60,60,0.6)';
          ctx.beginPath(); ctx.moveTo(-13,0); ctx.lineTo(-25,-4); ctx.lineTo(-22,0); ctx.lineTo(-25,4); ctx.closePath(); ctx.fill();
        }
        break;
      }
      // 第六关·逃脱要塞：爆炸碎片（不规则岩石带能量裂纹）+ 废墟核心
      case 'debris':
      case 'debris_big':{
        ctx.rotate(this.ang);
        const r=this.w/2;
        const rg=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
        if(!flash){ rg.addColorStop(0,'#9a8a6a'); rg.addColorStop(0.6,'#5a4a3a'); rg.addColorStop(1,'#1a0a04'); }
        else { rg.addColorStop(0,'#fff'); rg.addColorStop(1,'#aaa'); }
        ctx.fillStyle=rg;
        ctx.beginPath();
        this.shape.forEach((p,i)=>{ const x=p[0]*r,y=p[1]*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
        ctx.closePath(); ctx.fill();
        // 能量裂纹（橙红发光，提示会爆炸）
        ctx.shadowBlur=8; ctx.shadowColor='#ff5a3c';
        ctx.strokeStyle='#ff7a3c'; ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(-r*0.5,0); ctx.lineTo(r*0.3,-r*0.2); ctx.lineTo(r*0.5,r*0.3);
        ctx.moveTo(-r*0.2,-r*0.4); ctx.lineTo(0,r*0.1); ctx.lineTo(-r*0.4,r*0.4);
        ctx.stroke();
        ctx.shadowBlur=0;
        break;
      }
      case 'ruin_core':{
        // 废墟核心：六边形机械核心 + 旋转外环 + 红色发射口
        ctx.rotate(this.t*0.5);
        const r=this.w/2;
        ctx.fillStyle=flash?'#fff':'#3a2a3a';
        ctx.beginPath();
        for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const x=Math.cos(a)*r,y=Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#9a3a6a'; ctx.lineWidth=2; ctx.stroke();
        ctx.rotate(-this.t*1.0);
        // 旋转外环
        ctx.strokeStyle=flash?'#fff':'#ff3a6a'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,r*0.7,0,Math.PI*1.5); ctx.stroke();
        // 中心红核
        ctx.shadowBlur=10; ctx.shadowColor='#ff3a3a';
        ctx.fillStyle=flash?'#fff':'#ff3a3a';
        const cp=1+Math.sin(this.t*8)*0.2;
        ctx.beginPath(); ctx.arc(0,0,5*cp,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        break;
      }
    }
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

/* ------------------------------ Boss ------------------------------ */
class Boss{
  constructor(game,type){
    this.game=game; this.type=type;
    this.x=game.camX + W + 140; this.y=H/2;
    this.entered=false; this.dead=false;
    this.fireTimer=1.5; this.t=0; this.hitFlash=0;
    const hpMap={1:140,2:200,3:280,4:500,5:750,6:1200}; // boss6 巨型机器人血量最高
    const hpMul = DIFFICULTY[game.difficulty||'normal'].hpMul;  // 难度调整：困难 1.5x
    this.maxHp=Math.round((hpMap[type]||140) * hpMul);
    this.hp=this.maxHp;
    this.phase=1; this.dirY=1; this.alarmPlayed=false;
    this.laserBulletTimer=3.0;   // 首次激光子弹延迟
    this.continuousLaserTimer=0; // boss6 连续激光计时器
    this.continuousLaserActive=false;
    this.continuousLaserDur=0;   // 当前激光持续时长
    this.continuousLaserY=H/2;   // 连续激光的Y位置
    this.w=220; this.h=140;
    if(type===1){ this.w=200; this.h=160; }
    else if(type===2){ this.w=220; this.h=140; }
    else if(type===3){ this.w=240; this.h=160; }
    else if(type===4){ this.w=260; this.h=150; }
    else if(type===5){ this.w=280; this.h=200; }
    else { this.w=320; this.h=240; }   // type 6 巨型机器人最大
    this._rockPts=null;
  }
  coreBounds(){ return {x:this.x-24,y:this.y-24,w:48,h:48}; }
  bounds(){ return {x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}; }
  update(dt){
    this.t+=dt;
    if(this.hitFlash>0) this.hitFlash-=dt;
    if(!this.entered){
      this.x-=260*dt;
      const targetX = this.game.camX + W - 150;
      if(this.x<=targetX){ this.entered=true; this.x=targetX; }
      return;
    }
    if(!this.alarmPlayed){ Audio2.bossWarn(); this.alarmPlayed=true; }
    this.y+=this.dirY*55*dt;
    if(this.y<130) this.dirY=1;
    if(this.y>H-130) this.dirY=-1;
    const ratio=this.hp/this.maxHp;
    const newPhase = ratio>0.5?1:(ratio>0.25?2:3);
    if(newPhase!==this.phase){ this.phase=newPhase; this.game.toast('BOSS 阶段 '+this.phase); }
    this.fireTimer-=dt*this.game.fireScale();
    if(this.fireTimer<=0){
      if(this.type===1){
        if(this.phase===1){ this.fireTimer=1.4; this.fireFan(4,0.3); }
        else if(this.phase===2){ this.fireTimer=1.0; this.fireFan(6,0.35); if(Math.random()<0.5) this.summonAsteroid(); }
        else { this.fireTimer=0.7; this.fireFan(7,0.4); this.fireBarrage(4,0.12); if(Math.random()<0.6) this.summonAsteroid(); }
      } else if(this.type===2){   // boss2 弹幕：扇形 + 双臂螺旋 + 密集弹流
        if(this.phase===1){ this.fireTimer=0.65; this.fireAimed(3,0.12); }
        else if(this.phase===2){ this.fireTimer=0.5; this.fireSpiralMulti(2,5); this.fireAimed(2,0.1); }
        else { this.fireTimer=0.4; this.fireSpiralMulti(2,7); this.fireBarrage(5,0.1); if(Math.random()<0.4) this.fireFan(6,0.35); }
      } else if(this.type===3){   // boss3 弹幕：螺旋 + 放射圈交织
        if(this.phase===1){ this.fireTimer=0.5; this.fireSpiral(10); }
        else if(this.phase===2){ this.fireTimer=0.4; this.fireSpiral(12); this.fireBurst(10,150); }
        else { this.fireTimer=0.3; this.fireSpiralMulti(3,5); this.fireBurst(14,170); if(Math.random()<0.5) this.fireBarrage(4,0.1); }
      } else if(this.type===4){   // boss4 火龙：火球 + 弹幕交织
        if(this.phase===1){ this.fireTimer=1.1; this.fireFan(6,0.32); this.summonFireBall(); }
        else if(this.phase===2){ this.fireTimer=0.85; this.fireFan(8,0.35); this.fireBarrage(3,0.12); this.summonFireBall(); }
        else { this.fireTimer=0.55; this.fireSpiral(10); this.fireFan(7,0.4); this.summonFireBall(); if(Math.random()<0.4) this.fireBurst(12,160); }
      } else if(this.type===5){   // boss5 骷髅王：能量圈 + 双臂螺旋 + 腐蚀液
        if(this.phase===1){ this.fireTimer=1.2; this.fireRing(18,130); }
        else if(this.phase===2){ this.fireTimer=0.95; this.fireRing(22,130); this.fireSpiralMulti(2,4); if(Math.random()<0.5) this.summonMutant(); }
        else { this.fireTimer=0.7; this.fireRing(26,140); this.fireSpiralMulti(3,5); this.summonMutant(); if(Math.random()<0.5) this.fireCorrosiveFan(); }
      } else if(this.type===6){   // boss6 巨型机器人：逆天弹幕 + 连续激光
        if(this.phase===1){ this.fireTimer=0.8; this.fireSpiralMulti(3,6); this.fireBurst(12,150); }
        else if(this.phase===2){ this.fireTimer=0.55; this.fireSpiralMulti(4,5); this.fireBurst(16,160); this.fireBarrage(4,0.1); }
        else { this.fireTimer=0.35; this.fireSpiralMulti(4,7); this.fireBurst(20,170); this.fireBarrage(6,0.08); if(Math.random()<0.4) this.fireRing(14,140); }
      }
    }
    // Boss 激光子弹：周期性朝玩家发射，命中扣 2 滴血（2-6 关 Boss 才发射，频率更高）
    if(this.type>=2){
      this.laserBulletTimer-=dt;
      if(this.laserBulletTimer<=0){
        this.laserBulletTimer = this.type===6?2.0:(this.type===5?2.5:(this.type===4?3.0:3.5));
        this.fireLaserBullet();
        // 阶段 3 时连发 2 颗（双管齐下）
        if(this.phase===3){
          this.fireLaserBullet(true);   // 偏移发射第二颗
        }
      }
    }
    // boss6 专属：连续激光（持续扫射的全屏激光线）
    if(this.type===6){
      this.continuousLaserTimer-=dt;
      if(!this.continuousLaserActive && this.continuousLaserTimer<=0){
        // 开始一轮连续激光：持续 1.8s，锁定玩家当前Y
        this.continuousLaserActive=true;
        this.continuousLaserDur=1.8;
        this.continuousLaserY=this.game.player.y;   // 锁定玩家Y
        Audio2.laser();
      }
      if(this.continuousLaserActive){
        this.continuousLaserDur-=dt;
        // 激光缓慢追踪玩家Y（让玩家需要持续移动躲避）
        this.continuousLaserY += clamp(this.game.player.y - this.continuousLaserY, -120, 120)*dt;
        // 扫描激光路径上的玩家：每0.2秒造成1点伤害
        if(Math.floor((this.continuousLaserDur+dt)*5) !== Math.floor(this.continuousLaserDur*5)){
          const p=this.game.player;
          const halfH=18;
          if(p.y >= this.continuousLaserY-halfH && p.y <= this.continuousLaserY+halfH && p.x > this.x-200){
            p.hurt(1);
          }
        }
        // 激光结束时进入冷却
        if(this.continuousLaserDur<=0){
          this.continuousLaserActive=false;
          this.continuousLaserTimer = this.phase===3?2.5:(this.phase===2?3.5:5.0);   // 阶段越高冷却越短
        }
      }
    }
  }
  // 绘制 boss6 连续激光（全屏水平扫射光束）
  drawContinuousLaser(ctx, camX){
    if(!this.continuousLaserActive) return;
    const sx=this.x-camX;
    const beamY=this.continuousLaserY;
    const pulse=1+Math.sin(this.t*30)*0.15;
    const halfH=18*pulse;
    ctx.save();
    // 外光晕
    ctx.shadowBlur=30; ctx.shadowColor='#ff3a3a';
    const g=ctx.createLinearGradient(0,beamY-halfH,0,beamY+halfH);
    g.addColorStop(0,'rgba(255,58,58,0.1)'); g.addColorStop(0.5,'#ff3a3a'); g.addColorStop(1,'rgba(255,58,58,0.1)');
    ctx.fillStyle=g;
    ctx.fillRect(0, beamY-halfH, W, halfH*2);
    // 内核：白热
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.fillRect(0, beamY-2, W, 4);
    // 警告边缘（闪烁）
    ctx.strokeStyle='rgba(255,255,255,'+(0.5+Math.sin(this.t*20)*0.3)+')'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0, beamY-halfH); ctx.lineTo(W, beamY-halfH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, beamY+halfH); ctx.lineTo(W, beamY+halfH); ctx.stroke();
    ctx.restore();
  }
  // Boss 激光子弹：朝玩家方向发射梯形激光，命中扣 2 滴血
  fireLaserBullet(offset=false){
    const p=this.game.player;
    const sp=CFG.enemyBulletSpeed*1.4;     // 激光子弹更快
    const dx=p.x-this.x, dy=p.y-this.y;
    const m=Math.hypot(dx,dy)||1;
    // 第二颗偏移发射：与玩家方向偏 0.18 弧度，避开重合
    const ang = offset ? Math.atan2(dy,dx)+0.18 : Math.atan2(dy,dx);
    const vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp;
    this.game.bullets.push(new Bullet(this.x-30,this.y,vx,vy,
      {w:14,h:14,dmg:2,color:'#ff3a3a',friendly:false,laser:true,bossLaser:true}));
  }
  summonAsteroid(){
    this.game.enemies.push(new Enemy('asteroid_s', this.x-rand(20,80), this.y+rand(-60,60), this.game));
  }
  summonFireBall(){
    this.game.enemies.push(new Enemy('fire_ball', this.x-rand(20,80), this.y+rand(-60,60), this.game));
  }
  // 骷髅王召唤变异体
  summonMutant(){
    this.game.enemies.push(new Enemy(choice(['mutant_grunt','mutant_crawler']), this.x-rand(20,80), this.y+rand(-80,80), this.game));
  }
  // 骷髅王：腐蚀液扇形（朝玩家方向）
  fireCorrosiveFan(){
    const p=this.game.player;
    const sp=CFG.enemyBulletSpeed*0.8;
    const base=Math.atan2(p.y-this.y, p.x-this.x);
    for(let i=0;i<5;i++){
      const a=base+(i-2)*0.22;
      this.game.bullets.push(new Bullet(this.x-30,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:11,h:11,dmg:1,color:COLORS.corrosive,friendly:false,corrosive:true}));
    }
  }
  fireAimed(n,spread){
    const p=this.game.player;
    const sp=CFG.enemyBulletSpeed*1.05;
    const dx=p.x-this.x, dy=p.y-this.y;
    const base=Math.atan2(dy,dx);
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*spread;
      this.game.bullets.push(new Bullet(this.x-40,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:9,h:9,dmg:1,color:COLORS.enemyBullet,friendly:false}));
    }
  }
  fireFan(n,spread){
    const sp=CFG.enemyBulletSpeed;
    const base=Math.PI;
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*spread;
      this.game.bullets.push(new Bullet(this.x-40,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:9,h:9,dmg:1,color:COLORS.enemyBullet,friendly:false}));
    }
  }
  fireSpiral(n){
    const sp=CFG.enemyBulletSpeed;
    const off=this.t*2;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+off;
      this.game.bullets.push(new Bullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:9,h:9,dmg:1,color:COLORS.enemyBullet,friendly:false}));
    }
  }
  // 骷髅王：能量圈——从中心向四周均匀放射 n 颗子弹（形成扩张圆环）
  fireRing(n, speed){
    const sp=speed||CFG.enemyBulletSpeed;
    const off=this.t*1.5;   // 每次发射有旋转偏移，让多圈不重合
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+off;
      this.game.bullets.push(new Bullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:9,h:9,dmg:1,color:COLORS.boss5,friendly:false}));
    }
  }
  // 弹幕：多臂螺旋（双臂/三臂同时旋转发射，形成交织弹幕）
  fireSpiralMulti(arms, perArm, speed){
    const sp=speed||CFG.enemyBulletSpeed*0.9;
    const off=this.t*2.5;
    for(let a=0;a<arms;a++){
      const armOff=(a/arms)*Math.PI*2;
      for(let i=0;i<perArm;i++){
        const ang=armOff + (i/perArm)*Math.PI*0.6 + off;   // 每支臂扇形展开
        this.game.bullets.push(new Bullet(this.x,this.y,Math.cos(ang)*sp,Math.sin(ang)*sp,
          {w:8,h:8,dmg:1,color:COLORS.enemyBullet,friendly:false}));
      }
    }
  }
  // 弹幕：朝玩家方向的密集弹流（带轻微扩散）
  fireBarrage(n, spread, speed){
    const p=this.game.player;
    const sp=speed||CFG.enemyBulletSpeed*1.15;
    const dx=p.x-this.x, dy=p.y-this.y;
    const base=Math.atan2(dy,dx);
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*spread;
      this.game.bullets.push(new Bullet(this.x-40,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:8,h:8,dmg:1,color:COLORS.enemyBullet,friendly:false}));
    }
  }
  // 弹幕：高密度放射圈（比 fireRing 更密更快）
  fireBurst(n, speed){
    const sp=speed||CFG.enemyBulletSpeed*1.1;
    const off=this.t*3;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+off;
      this.game.bullets.push(new Bullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,
        {w:7,h:7,dmg:1,color:'#ff7a8a',friendly:false}));
    }
  }
  takeDamage(dmg,isCore){
    this.hp-=isCore?dmg*2:dmg;
    this.hitFlash=0.05;
    if(this.hp<=0 && !this.dead) this.die();
  }
  die(){
    this.dead=true;
    this.game.score+=6000; this.game.kills++;
    Audio2.bigExplode();
    this.game.shake=0.8; this.game.flash=0.5;
    for(let i=0;i<100;i++){
      spawnExplosion(this.game.particles,this.x+rand(-90,90),this.y+rand(-60,60),
        choice(['#ff9a3c','#ffd24d','#ff4d6d','#fff']),6,1.2);
    }
    for(let i=0;i<3;i++) this.game.spawnCrystal(this.x+rand(-40,40),this.y+rand(-40,40));
    this.game.spawnLifeDrop(this.x, this.y);
    this.game.spawnBombCrystal(this.x, this.y+20);
  }
  bossColor(){
    if(this.type===1) return COLORS.boss1;
    if(this.type===2) return COLORS.boss2;
    if(this.type===3) return COLORS.boss3;
    if(this.type===4) return COLORS.boss4;
    if(this.type===6) return COLORS.boss6;
    return COLORS.boss5;
  }
  draw(ctx,camX){
    const sx=this.x-camX;
    ctx.save();
    ctx.translate(sx,this.y);
    const flash=this.hitFlash>0;
    // 背景光晕：让 boss 看起来更有威慑感
    const auraPulse=1+Math.sin(this.t*2)*0.15;
    const aura=ctx.createRadialGradient(0,0,0,0,0,140*auraPulse);
    aura.addColorStop(0,'rgba(255,255,255,0.15)');
    aura.addColorStop(0.5,this.bossColor()+'40');
    aura.addColorStop(1,'transparent');
    ctx.fillStyle=aura;
    ctx.beginPath(); ctx.arc(0,0,140*auraPulse,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=18; ctx.shadowColor=this.bossColor();
    if(this.type===1){
      const r=80;
      ctx.fillStyle=flash?'#fff':'#7a5a3a';
      ctx.beginPath();
      if(!this._rockPts){ this._rockPts=[]; for(let i=0;i<12;i++){ const ang=i/12*Math.PI*2; this._rockPts.push([Math.cos(ang)*r*rand(0.8,1.1),Math.sin(ang)*r*rand(0.8,1.1)]); } }
      this._rockPts.forEach((p,i)=>{ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#3a2a1a';
      ctx.beginPath(); ctx.arc(-30,-20,20,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(30,30,15,0,Math.PI*2); ctx.fill();
      const pulse=1+Math.sin(this.t*6)*0.2;
      ctx.shadowBlur=20; ctx.shadowColor='#fff';
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,18*pulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=this.bossColor(); ctx.beginPath(); ctx.arc(0,0,11*pulse,0,Math.PI*2); ctx.fill();
    } else if(this.type===2){
      ctx.fillStyle=flash?'#fff':this.bossColor();
      ctx.beginPath();
      ctx.moveTo(80,0); ctx.lineTo(40,-60); ctx.lineTo(-80,-55); ctx.lineTo(-100,0); ctx.lineTo(-80,55); ctx.lineTo(40,60);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#3a1a5a'; ctx.fillRect(-70,-45,60,90);
      ctx.fillStyle='#ff4d6d'; ctx.fillRect(-110,-35,16,16); ctx.fillRect(-110,19,16,16);
      const pulse=1+Math.sin(this.t*6)*0.15;
      ctx.shadowBlur=20; ctx.shadowColor='#fff';
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,16*pulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=this.bossColor(); ctx.beginPath(); ctx.arc(0,0,9*pulse,0,Math.PI*2); ctx.fill();
    } else if(this.type===3){
      ctx.rotate(this.t*0.5);
      ctx.fillStyle=flash?'#fff':this.bossColor();
      ctx.beginPath();
      for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; const r=i%2?60:90; const x=Math.cos(a)*r,y=Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.closePath(); ctx.fill();
      ctx.rotate(-this.t*0.5);
      ctx.fillStyle='#2a0a1a'; ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill();
      const pulse=1+Math.sin(this.t*8)*0.25;
      ctx.shadowBlur=25; ctx.shadowColor='#fff';
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,22*pulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=this.bossColor(); ctx.beginPath(); ctx.arc(0,0,14*pulse,0,Math.PI*2); ctx.fill();
    } else if(this.type===4){ // type 4 火龙
      ctx.fillStyle=flash?'#fff':this.bossColor();
      // 龙身：长蛇形
      ctx.beginPath();
      ctx.moveTo(110,0);
      for(let i=0;i<6;i++){ const x=100-i*30; const y=Math.sin(this.t*3+i*0.8)*30; ctx.lineTo(x,y-22); }
      for(let i=5;i>=0;i--){ const x=100-i*30; const y=Math.sin(this.t*3+i*0.8)*30; ctx.lineTo(x,y+22); }
      ctx.closePath(); ctx.fill();
      // 翅膀
      ctx.fillStyle='#9a2a0a';
      const wing=Math.sin(this.t*6)*10;
      ctx.beginPath(); ctx.moveTo(20,-20); ctx.lineTo(40,-60-wing); ctx.lineTo(60,-20); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(20,20); ctx.lineTo(40,60+wing); ctx.lineTo(60,20); ctx.closePath(); ctx.fill();
      // 龙头
      ctx.fillStyle=flash?'#fff':'#ff5a1a';
      ctx.beginPath(); ctx.moveTo(110,0); ctx.lineTo(70,-26); ctx.lineTo(60,-10); ctx.lineTo(50,0); ctx.lineTo(60,10); ctx.lineTo(70,26);
      ctx.closePath(); ctx.fill();
      // 眼睛
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(85,-8,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.arc(85,-8,2,0,Math.PI*2); ctx.fill();
      // 核心
      const pulse=1+Math.sin(this.t*8)*0.3;
      ctx.shadowBlur=25; ctx.shadowColor='#fff';
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(20,0,16*pulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=this.bossColor(); ctx.beginPath(); ctx.arc(20,0,10*pulse,0,Math.PI*2); ctx.fill();
      // 喷火
      if(this.phase>=2){
        ctx.shadowBlur=15; ctx.shadowColor='#ff5a1a';
        ctx.fillStyle='rgba(255,90,26,'+(0.4+Math.sin(this.t*10)*0.2)+')';
        ctx.beginPath(); ctx.moveTo(110,0); ctx.lineTo(150,-8); ctx.lineTo(160,0); ctx.lineTo(150,8); ctx.closePath(); ctx.fill();
      }
    } else if(this.type===5){ // type 5 骷髅王
      // 额外能量圈光环（持续旋转）
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(208,208,224,'+(0.2+Math.sin(this.t*2)*0.1)+')';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,130+Math.sin(this.t*1.5)*6,0,Math.PI*2); ctx.stroke();
      // 头骨主体（渐变骨色）
      const skullG=ctx.createRadialGradient(-20,-20,10,0,0,90);
      if(!flash){ skullG.addColorStop(0,'#f0f0fa'); skullG.addColorStop(0.5,'#d0d0e0'); skullG.addColorStop(1,'#6a6a7a'); }
      else { skullG.addColorStop(0,'#fff'); skullG.addColorStop(1,'#ccc'); }
      ctx.fillStyle=skullG;
      ctx.shadowBlur=18; ctx.shadowColor=this.bossColor();
      ctx.beginPath();
      // 头骨轮廓：上部圆顶 + 下颌
      ctx.moveTo(-70,30);
      ctx.quadraticCurveTo(-90,0,-80,-40);
      ctx.quadraticCurveTo(-65,-80,0,-85);
      ctx.quadraticCurveTo(65,-80,80,-40);
      ctx.quadraticCurveTo(90,0,70,30);
      // 下颌齿状
      ctx.lineTo(50,50); ctx.lineTo(40,35); ctx.lineTo(25,55); ctx.lineTo(10,35);
      ctx.lineTo(-10,55); ctx.lineTo(-25,35); ctx.lineTo(-40,50);
      ctx.closePath();
      ctx.fill();
      // 额头裂纹
      ctx.shadowBlur=0;
      ctx.strokeStyle='#3a3a4a'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-30,-60); ctx.lineTo(-20,-40); ctx.lineTo(-28,-25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(25,-55); ctx.lineTo(35,-30); ctx.stroke();
      // 双眼眼窝（发光紫黑能量）
      const eyePulse=1+Math.sin(this.t*5)*0.15;
      ctx.shadowBlur=20; ctx.shadowColor='#9a3aff';
      const eyeG=ctx.createRadialGradient(-30,-20,0,-30,-20,20);
      eyeG.addColorStop(0,'#fff'); eyeG.addColorStop(0.3,'#d05aff'); eyeG.addColorStop(1,'#1a0a2a');
      ctx.fillStyle=eyeG;
      ctx.beginPath(); ctx.ellipse(-30,-20,16*eyePulse,18*eyePulse,0,0,Math.PI*2); ctx.fill();
      const eyeG2=ctx.createRadialGradient(30,-20,0,30,-20,20);
      eyeG2.addColorStop(0,'#fff'); eyeG2.addColorStop(0.3,'#d05aff'); eyeG2.addColorStop(1,'#1a0a2a');
      ctx.fillStyle=eyeG2;
      ctx.beginPath(); ctx.ellipse(30,-20,16*eyePulse,18*eyePulse,0,0,Math.PI*2); ctx.fill();
      // 瞳孔（核心红点）
      ctx.shadowBlur=12; ctx.shadowColor='#ff2020';
      ctx.fillStyle='#ff3030';
      ctx.beginPath(); ctx.arc(-30,-18,3*eyePulse,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(30,-18,3*eyePulse,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      // 鼻骨（三角空洞）
      ctx.fillStyle='#1a0a1a';
      ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(-8,15); ctx.lineTo(8,15); ctx.closePath(); ctx.fill();
      // 牙齿（下排，发亮）
      ctx.fillStyle='#fffaf0';
      ctx.shadowBlur=4; ctx.shadowColor='#fff';
      for(let i=-3;i<=3;i++){
        ctx.beginPath();
        ctx.moveTo(i*12+6,35); ctx.lineTo(i*12,55); ctx.lineTo(i*12+12,55); ctx.closePath();
        ctx.fill();
      }
      ctx.shadowBlur=0;
      // 核心弱点（眉心第三眼——只有这里算核心）
      const cpulse=1+Math.sin(this.t*7)*0.3;
      ctx.shadowBlur=20; ctx.shadowColor='#fff';
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(0,-55,8*cpulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=this.bossColor();
      ctx.beginPath(); ctx.arc(0,-55,5*cpulse,0,Math.PI*2); ctx.fill();
      // phase≥2 时周身旋转能量圈（视觉警告）
      if(this.phase>=2){
        ctx.strokeStyle='rgba(208,90,255,'+(0.5+Math.sin(this.t*4)*0.3)+')';
        ctx.lineWidth=3;
        ctx.save(); ctx.rotate(this.t*1.2);
        ctx.beginPath(); ctx.arc(0,0,95,0,Math.PI*1.4); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,105,Math.PI,Math.PI*1.4+Math.PI); ctx.stroke();
        ctx.restore();
      }
    } else if(this.type===6){ // type 6 巨型机器人
      // 外环能量警告弧（持续旋转）
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,32,48,'+(0.3+Math.sin(this.t*3)*0.15)+')';
      ctx.lineWidth=3;
      ctx.save(); ctx.rotate(this.t*0.3);
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2;
        ctx.beginPath();
        ctx.arc(0,0,160, a, a+Math.PI*0.25);
        ctx.stroke();
      }
      ctx.restore();
      // 主体躯干（金属渐变）
      const bodyG=ctx.createLinearGradient(0,-80,0,80);
      if(!flash){ bodyG.addColorStop(0,'#4a3a4a'); bodyG.addColorStop(0.5,'#3a2a3a'); bodyG.addColorStop(1,'#1a1a2a'); }
      else { bodyG.addColorStop(0,'#fff'); bodyG.addColorStop(1,'#aaa'); }
      ctx.fillStyle=bodyG;
      ctx.shadowBlur=15; ctx.shadowColor=this.bossColor();
      ctx.beginPath();
      ctx.moveTo(-90,-70); ctx.lineTo(90,-70); ctx.lineTo(110,-30);
      ctx.lineTo(100,80); ctx.lineTo(70,100); ctx.lineTo(-70,100);
      ctx.lineTo(-100,80); ctx.lineTo(-110,-30); ctx.closePath(); ctx.fill();
      // 装甲分缝
      ctx.shadowBlur=0;
      ctx.strokeStyle='#1a0a1a'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-60,-60); ctx.lineTo(-60,80); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(60,-60); ctx.lineTo(60,80); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-90,-10); ctx.lineTo(90,-10); ctx.stroke();
      // 肩部装甲三角
      ctx.fillStyle=flash?'#fff':'#5a3a4a';
      ctx.shadowBlur=10; ctx.shadowColor=this.bossColor();
      ctx.beginPath(); ctx.moveTo(-110,-30); ctx.lineTo(-150,-70); ctx.lineTo(-120,-10); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(110,-30); ctx.lineTo(150,-70); ctx.lineTo(120,-10); ctx.closePath(); ctx.fill();
      // 机械头部（六边形头盔）
      ctx.fillStyle=flash?'#fff':'#2a2a3a';
      ctx.beginPath();
      ctx.moveTo(0,-110); ctx.lineTo(40,-95); ctx.lineTo(50,-65); ctx.lineTo(25,-50);
      ctx.lineTo(-25,-50); ctx.lineTo(-50,-65); ctx.lineTo(-40,-95); ctx.closePath(); ctx.fill();
      // 头部裂纹
      ctx.shadowBlur=0;
      ctx.strokeStyle='#1a0a1a'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-30,-80); ctx.lineTo(-10,-60); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(30,-80); ctx.lineTo(15,-65); ctx.stroke();
      // 头部独眼光学传感器（脉冲）
      const eyePulse=1+Math.sin(this.t*8)*0.2;
      ctx.shadowBlur=22; ctx.shadowColor='#ff3030';
      const eyeG=ctx.createRadialGradient(0,-75,0,0,-75,18);
      eyeG.addColorStop(0,'#fff'); eyeG.addColorStop(0.3,'#ff5a4a'); eyeG.addColorStop(1,'#5a0a0a');
      ctx.fillStyle=eyeG;
      ctx.beginPath(); ctx.ellipse(0,-75,20*eyePulse,8*eyePulse,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(0,-75,3*eyePulse,0,Math.PI*2); ctx.fill();
      // 胸口能量核心（弱点）
      const corePulse=1+Math.sin(this.t*5)*0.3;
      ctx.shadowBlur=25; ctx.shadowColor=this.bossColor();
      const coreG=ctx.createRadialGradient(0,10,0,0,10,30);
      coreG.addColorStop(0,'#fff'); coreG.addColorStop(0.4,this.bossColor()); coreG.addColorStop(1,'#2a0a0a');
      ctx.fillStyle=coreG;
      ctx.beginPath(); ctx.arc(0,10,24*corePulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(0,10,6*corePulse,0,Math.PI*2); ctx.fill();
      // 左右机械臂（带炮口）
      ctx.shadowBlur=8; ctx.shadowColor=this.bossColor();
      ctx.fillStyle=flash?'#fff':'#3a2a3a';
      ctx.beginPath();
      ctx.moveTo(-100,-20); ctx.lineTo(-140,-10); ctx.lineTo(-145,30); ctx.lineTo(-105,40); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#1a0a1a';
      ctx.beginPath(); ctx.arc(-145,15,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=this.bossColor();
      ctx.beginPath(); ctx.arc(-145,15,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=flash?'#fff':'#3a2a3a';
      ctx.beginPath();
      ctx.moveTo(100,-20); ctx.lineTo(140,-10); ctx.lineTo(145,30); ctx.lineTo(105,40); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#1a0a1a';
      ctx.beginPath(); ctx.arc(145,15,12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=this.bossColor();
      ctx.beginPath(); ctx.arc(145,15,5,0,Math.PI*2); ctx.fill();
      // 能量纹路（沿躯干发光线条）
      ctx.shadowBlur=6; ctx.shadowColor=this.bossColor();
      ctx.strokeStyle=this.bossColor();
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-60,30); ctx.lineTo(-30,40); ctx.lineTo(0,30); ctx.lineTo(30,40); ctx.lineTo(60,30);
      ctx.stroke();
      // 连续激光发射时：胸口核心额外能量光波
      if(this.continuousLaserActive){
        ctx.shadowBlur=30; ctx.shadowColor='#ff3a3a';
        ctx.fillStyle='rgba(255,58,58,'+(0.5+Math.sin(this.t*15)*0.3)+')';
        ctx.beginPath(); ctx.arc(0,10,40*corePulse,0,Math.PI*2); ctx.fill();
      }
      // phase≥2：肩部能量尖刺长出
      if(this.phase>=2){
        ctx.shadowBlur=15; ctx.shadowColor='#ff3030';
        ctx.fillStyle=this.bossColor();
        for(let s=-1;s<=1;s+=2){
          ctx.beginPath();
          ctx.moveTo(s*120,-50);
          ctx.lineTo(s*170,-95);
          ctx.lineTo(s*125,-65);
          ctx.closePath();
          ctx.fill();
        }
      }
      // phase≥3：双眼扫描线 + 顶部天线
      if(this.phase>=3){
        ctx.shadowBlur=12; ctx.shadowColor='#ff3030';
        ctx.strokeStyle='#ff3030';
        ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(-15,-75); ctx.lineTo(15,-75); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,-110); ctx.lineTo(0,-135); ctx.stroke();
        ctx.fillStyle='#ff3030';
        ctx.beginPath(); ctx.arc(0,-138,4,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.shadowBlur=0;
    ctx.restore();
    // 连续激光（独立于 translate，覆盖全屏水平光束）
    this.drawContinuousLaser(ctx, camX);
  }
}

class Spawner{
  constructor(game,interval,waveList){
    this.game=game; this.interval=interval; this.waveList=waveList;
    this.timer=0.2;
  }
  update(dt){
    this.timer-=dt;
    if(this.timer<=0){
      this.timer=this.interval*rand(0.8,1.2);
      this.spawnWave();
    }
  }
  spawnWave(){
    const wave=choice(this.waveList)();
    const baseX=this.game.camX+W+CFG.spawnPadding;
    const baseY=H/2;
    for(const w of wave) this.game.enemies.push(new Enemy(w.t,baseX,baseY+w.oy,this.game));
  }
}

  { name:'第一关 · 陨石地带', theme:'asteroid', length:3200, scrollSpeed:95, spawnInterval:1.3, enemyHp:1, bossType:1, obstacleType:'asteroid' },
  { name:'第二关 · 堡垒内部', theme:'fortress', length:3600, scrollSpeed:105, spawnInterval:1.1, enemyHp:3, bossType:2, obstacleType:'fortress' },
  { name:'第三关 · 堡垒核心', theme:'core',     length:4000, scrollSpeed:115, spawnInterval:0.95, enemyHp:5, bossType:3, obstacleType:'core' },
  { name:'第四关 · 火海',     theme:'fire',     length:4400, scrollSpeed:125, spawnInterval:0.9,  enemyHp:5, bossType:4, obstacleType:'fire' },
  { name:'第五关 · β星人墓穴', theme:'tomb',    length:4800, scrollSpeed:130, spawnInterval:0.85, enemyHp:5, bossType:5, obstacleType:'tomb' },
  { name:'第六关 · 逃脱要塞', theme:'escape',   length:9200, scrollSpeed:200, spawnInterval:1.2,  enemyHp:5, bossType:6, obstacleType:'escape', obstacleOnlyFrom:4600 },   // 后半纯障碍（加长版）
