/* ------------------------------ 主游戏 ------------------------------ */
class Game{
  constructor(){
    this.state='TITLE';
    this.starfield=new Starfield('space');
    this.titleSelected=0; // 选关：当前选中关卡索引（-1=从头开始，0-3=对应关卡）
    this.difficulty='normal'; // 难度：easy/normal/hard
    this.reset();
  }
  // 难度系数：用于敌人/Boss 子弹发射计时器的 dt 缩放（1/fireMul）
  fireScale(){ return 1 / DIFFICULTY[this.difficulty||'normal'].fireMul; }
  // 难度血量倍率
  hpMul(){ return DIFFICULTY[this.difficulty||'normal'].hpMul; }
  reset(){
    this.player=new Player(this);
    this.bullets=[]; this.enemies=[]; this.obstacles=[]; this.crystals=[]; this.lifeDrops=[]; this.bombCrystals=[]; this.particles=[];
    this.boss=null; this.camX=0;
    this.score=0; this.kills=0;
    this.levelIndex=0;
    this.shake=0; this.flash=0;
    this.toastText=''; this.toastTimer=0;
    this.startLevel(0);
  }
  startLevel(idx){
    this.levelIndex=idx;
    const L=LEVELS[idx];
    this.level=L;
    this.hpScale=L.hpScale;
    this.camX=0; this.scrollDistance=0;
    this.bossTriggered=false; this.boss=null;
    this.enemies=[]; this.obstacles=[];
    this.bullets=this.bullets.filter(b=>b.friendly);
    this._obstacleOnlyToasted=false;   // 重置纯障碍段提示
    this.starfield.setTheme(L.theme);
    this.spawner=new Spawner(this,L.spawnInterval,WAVE_TEMPLATES[idx+1]);
    this.obstacleSpawner=new ObstacleSpawner(this,L.obstacleType);
    this.toast(L.name);
  }
  toast(t){ this.toastText=t; this.toastTimer=2.5; }
  // 从指定关卡开始游戏
  startGameAt(idx){
    Audio2.init();
    this.reset();
    this.startLevel(idx);
    this.player.invincible=2.0;
    this.state='PLAYING';
  }
  addBullet(b){
    this.bullets.push(b);
    if(this.bullets.length>CFG.maxBullets){
      // 优先移除最早的离屏子弹，避免误删屏内 Boss 弹幕
      let idx=this.bullets.findIndex(x =>
        x.x<this.camX-80||x.x>this.camX+W+80||x.y<-80||x.y>H+80
      );
      if(idx>=0) this.bullets.splice(idx,1);
      else this.bullets.shift();
    }
  }
  spawnCrystal(x,y){ this.crystals.push(new Crystal(x,y)); }
  spawnLifeDrop(x,y){ this.lifeDrops.push(new LifeDrop(x,y)); }
  spawnBombCrystal(x,y){ this.bombCrystals.push(new BombCrystal(x,y)); }
  // 触发清屏：杀光屏幕内敌人 + 清空敌方子弹，Boss 不受伤害但子弹被清
  triggerScreenClear(){
    let killCount=0;
    for(const e of this.enemies){
      if(e.dead) continue;
      if(e.x>this.camX-40 && e.x<this.camX+W+40){
        e.hp=0; e.dead=true; e.die();
        killCount++;
      }
    }
    let bulletCount=0;
    for(let i=this.bullets.length-1;i>=0;i--){
      if(!this.bullets[i].friendly){
        const b=this.bullets[i];
        spawnExplosion(this.particles,b.x,b.y,'#3affd2',6,0.6);
        this.bullets.splice(i,1);
        bulletCount++;
      }
    }
    spawnExplosion(this.particles, this.camX+W/2, H/2, '#3affd2', 60, 3);
    this.shake=0.8;
    Audio2.screenClear();
    this.toast('清屏！清除 '+killCount+' 敌人 + '+bulletCount+' 子弹');
  }
  findNearestEnemy(x,y){
    let best=null,bd=Infinity;
    for(const e of this.enemies){ if(e.dead) continue; const d=dist2(x,y,e.x,e.y); if(d<bd){bd=d;best=e;} }
    if(this.boss && !this.boss.dead){ const d=dist2(x,y,this.boss.x,this.boss.y); if(d<bd){best=this.boss;} }
    return best;
  }
  onPlayerDead(){ this.state='GAME_OVER'; }  // playerDead 音效在 Player.hurt 中触发

  update(dt){
    const bgSpeed=(this.state==='PLAYING'||this.state==='BOSS')?this.level.scrollSpeed:40;
    this.starfield.update(dt,bgSpeed);

    if(this.state==='TITLE'){
      // 选关：上/下切换，回车开始选中关卡
      if(Input.justPressed('arrowup','w')){ this.titleSelected = (this.titleSelected - 1 + (LEVELS.length+1)) % (LEVELS.length+1); Audio2.hit(); }
      if(Input.justPressed('arrowdown','s')){ this.titleSelected = (this.titleSelected + 1) % (LEVELS.length+1); Audio2.hit(); }
      // 难度：A=上一个，D=下一个
      if(Input.justPressed('a')){
        const idx = DIFFICULTY_ORDER.indexOf(this.difficulty);
        this.difficulty = DIFFICULTY_ORDER[(idx-1+DIFFICULTY_ORDER.length)%DIFFICULTY_ORDER.length];
        Audio2.hit();
      }
      if(Input.justPressed('d')){
        const idx = DIFFICULTY_ORDER.indexOf(this.difficulty);
        this.difficulty = DIFFICULTY_ORDER[(idx+1)%DIFFICULTY_ORDER.length];
        Audio2.hit();
      }
      if(Input.justPressed('enter')){
        const lvl = this.titleSelected===0 ? 0 : this.titleSelected-1; // 0=从头开始，1-4=对应关
        this.startGameAt(lvl);
      }
      return;
    }
    if(this.state==='GAME_OVER'||this.state==='WIN'){
      if(Input.justPressed('enter')){
        this.reset();
        this.state='TITLE';
        this.titleSelected=0;
      }
      return;
    }
    if(Input.justPressed('p','escape')){ this.state = this.state==='PAUSED'?'PLAYING':'PAUSED'; }
    if(this.state==='PAUSED') return;

    if(this.shake>0) this.shake-=dt;
    if(this.flash>0) this.flash-=dt;
    if(this.toastTimer>0) this.toastTimer-=dt;

    const scrolling=(this.state==='PLAYING');
    if(scrolling){
      this.camX += this.level.scrollSpeed*dt;
      this.player.x += this.level.scrollSpeed*dt;
      this.scrollDistance += this.level.scrollSpeed*dt;
      // 第六关后半段：停止刷怪，只有障碍物（纯躲避）
      const obstacleOnly = this.level.obstacleOnlyFrom && this.scrollDistance >= this.level.obstacleOnlyFrom;
      if(!obstacleOnly) this.spawner.update(dt);
      else if(this.scrollDistance >= this.level.obstacleOnlyFrom + 50){
        // 进入纯障碍段时提示
        if(!this._obstacleOnlyToasted){ this._obstacleOnlyToasted=true; this.toast('躲避废墟！'); }
      }
      this.obstacleSpawner.update(dt);
      if(!this.bossTriggered && this.scrollDistance >= this.level.length){
        this.bossTriggered=true;
        this.boss=new Boss(this,this.level.bossType);
        this.state='BOSS';
        this.obstacles=[]; // 清空障碍物腾出战斗空间
        this.toast('WARNING: BOSS 来袭');
      }
    }

    if(this.player.alive) this.player.update(dt);

    for(const e of this.enemies) e.update(dt);
    this.enemies=this.enemies.filter(e=>!e.dead);

    for(const o of this.obstacles) o.update(dt);
    this.obstacles=this.obstacles.filter(o=>!o.dead);

    if(this.boss){
      this.boss.update(dt);
      if(this.boss.dead){
        // Boss 死亡瞬间清屏：清空敌方子弹、残留小怪与障碍，防止死后中弹
        this.bullets=this.bullets.filter(b=>b.friendly);
        this.enemies=[];
        this.obstacles=[];
        // 转化玩家误伤弹道为粒子，营造爆炸冲击
        spawnExplosion(this.particles, this.boss.x, this.boss.y, '#ffd24d', 40, 2.2);
        spawnExplosion(this.particles, this.boss.x, this.boss.y, '#ff5a1a', 30, 1.8);
        this.shake=1.0; this.flash=0.6;
        this.boss=null;
        if(this.levelIndex<LEVELS.length-1){
          // 进入过关停留：给玩家 3 秒拾取 Boss 掉落
          this.state='LEVEL_CLEAR';
          this.transitionTimer=0;
          this.toast('BOSS 击破！');
          Audio2.bossDead();
        }
        else { this.state='WIN'; Audio2.win(); }
      }
    }

    // 过关停留：3 秒让玩家收集 Boss 掉落物，然后飞出右端
    if(this.state==='LEVEL_CLEAR'){
      this.transitionTimer+=dt;
      // 玩家仍可控（移动/开火），但关卡滚动停止
      // 拾取物仍能被吸取（player.update 会处理）
      if(this.transitionTimer >= 4.5){
        this.state='LEVEL_OUT';
        this.transitionTimer=0;
      }
    }

    // 过渡：飞机飞出右端
    if(this.state==='LEVEL_OUT'){
      this.transitionTimer+=dt;
      // 飞机向右加速飞出
      this.player.vx += 1800*dt;
      this.player.vx = clamp(this.player.vx, 0, 900);
      this.player.x += this.player.vx*dt;
      // 飞出屏幕后切换关卡，从左侧飞入
      if(this.player.x > this.camX + W + 80){
        this.startLevel(this.levelIndex+1);
        this.player.x = this.camX - 60;
        this.player.y = H/2;
        this.player.vx = 420; this.player.vy = 0;
        this.player.invincible = 1.5;
        this.state='LEVEL_IN';
        this.transitionTimer=0;
      }
    }
    // 过渡：飞机从左侧飞入
    if(this.state==='LEVEL_IN'){
      this.transitionTimer+=dt;
      // 让滚动也开始
      this.camX += this.level.scrollSpeed*dt;
      this.scrollDistance += this.level.scrollSpeed*dt;
      // 用相对屏幕坐标判断（避免target随camX移动导致追不上）
      const screenX = this.player.x - this.camX; // 飞机在屏幕上的x位置
      const targetScreenX = 160;
      if(screenX < targetScreenX - 40){
        // 远距离：相对屏幕快速右移（飞机速度 = 滚动速度 + 额外）
        this.player.vx = this.level.scrollSpeed + 300;
      } else {
        // 近距离：相对屏幕慢速靠拢
        this.player.vx = this.level.scrollSpeed + Math.max(40, (targetScreenX - screenX)*4);
      }
      this.player.x += this.player.vx*dt;
      if(this.player.x - this.camX >= targetScreenX){
        this.player.x = this.camX + targetScreenX;
        this.player.vx = 0;
        this.state='PLAYING';
        Audio2.levelStart();
      }
    }

    for(const b of this.bullets){
      b.update(dt,this);
      if(b.x<this.camX-60||b.x>this.camX+W+60||b.y<-60||b.y>H+60) b.dead=true;
    }
    this.bullets=this.bullets.filter(b=>!b.dead);

    for(const c of this.crystals) c.update(dt, this.player);
    this.crystals=this.crystals.filter(c=>!c.dead);

    for(const l of this.lifeDrops) l.update(dt, this.player);
    this.lifeDrops=this.lifeDrops.filter(l=>!l.dead);

    for(const b of this.bombCrystals) b.update(dt, this.player);
    this.bombCrystals=this.bombCrystals.filter(b=>!b.dead);

    for(const p of this.particles) p.update(dt);
    this.particles=this.particles.filter(p=>!p.dead);

    this.collisions();
  }
  collisions(){
    const p=this.player;
    // 玩家子弹 vs 敌人/Boss/障碍物
    for(const b of this.bullets){
      if(!b.friendly||b.dead) continue;
      const bb=b.bounds();
      // vs 障碍物（子弹被阻挡消失，不造成伤害）
      let blocked=false;
      for(const o of this.obstacles){
        for(const hb of o.hitBoxes()){
          if(aabb(bb,hb)){
            spawnExplosion(this.particles,b.x,b.y,COLORS.obstacle,3,0.4);
            if(!b.pierce){ b.dead=true; blocked=true; }
            break;
          }
        }
        if(b.dead) break;
      }
      if(blocked) continue;
      // vs Boss
      if(this.boss && !this.boss.dead){
        const core=this.boss.coreBounds();
        const body=this.boss.bounds();
        if(aabb(bb,core)){
          this.boss.takeDamage(b.dmg,true);
          spawnExplosion(this.particles,b.x,b.y,'#fff',4,0.5);
          if(!b.pierce) b.dead=true; else b.hits.add(this.boss);
          continue;
        }
        if(aabb(bb,body)){
          this.boss.takeDamage(b.dmg,false);
          spawnExplosion(this.particles,b.x,b.y,this.boss.bossColor(),4,0.5);
          if(!b.pierce){ b.dead=true; continue; } else b.hits.add(this.boss);
        }
      }
      // vs 敌人
      for(const e of this.enemies){
        if(e.dead) continue;
        if(b.pierce && b.hits.has(e)) continue;
        if(aabb(bb,e.bounds())){
          e.takeDamage(b.dmg);
          spawnExplosion(this.particles,b.x,b.y,COLORS.bullet,3,0.4);
          Audio2.hit();
          if(!b.pierce){ b.dead=true; break; } else b.hits.add(e);
        }
      }
    }
    this.bullets=this.bullets.filter(b=>!b.dead);

    if(!p.alive) return;
    const pb=p.bounds();
    // 敌弹 vs 玩家
    for(const b of this.bullets){
      if(b.friendly||b.dead) continue;
      if(aabb(pb,b.bounds())){
        b.dead=true;
        // Boss 激光子弹一次扣 2 滴血；普通敌弹扣 1 滴
        const dmg = b.bossLaser ? 2 : 1;
        if(p.hurt(dmg)) break;
      }
    }
    this.bullets=this.bullets.filter(b=>!b.dead);
    // 敌人 vs 玩家
    for(const e of this.enemies){
      if(e.dead) continue;
      if(aabb(pb,e.bounds())){ e.takeDamage(99); if(p.hurt()) break; }
    }
    // Boss vs 玩家
    if(this.boss && !this.boss.dead && aabb(pb,this.boss.bounds())) p.hurt();
    // 障碍物 vs 玩家
    for(const o of this.obstacles){
      for(const hb of o.hitBoxes()){
        if(aabb(pb,hb)){ if(p.hurt()) break; }
      }
      if(p.invincible>0 && p.invincible<0.1) break; // 已受伤跳出
    }
    // 晶体拾取（满上限后碰到直接消失）
    for(const c of this.crystals){
      if(c.dead) continue;
      if(aabb(pb,c.bounds())){
        c.dead=true;
        if(p.crystals<CFG.maxCrystals) c.apply(p);
      }
    }
    // 生命补给拾取
    for(const l of this.lifeDrops){
      if(l.dead) continue;
      if(aabb(pb,l.bounds())){ l.dead=true; l.apply(p); }
    }
    // 清屏晶体拾取
    for(const b of this.bombCrystals){
      if(b.dead) continue;
      if(aabb(pb,b.bounds())){ b.dead=true; b.apply(p); }
    }
  }

  /* ------------------------------ 渲染 ------------------------------ */
  render(){
    const shakeX=this.shake>0?rand(-6,6)*this.shake:0;
    const shakeY=this.shake>0?rand(-6,6)*this.shake:0;
    CTX.save();
    CTX.translate(shakeX,shakeY);
    this.starfield.draw(CTX);
    if(this.state!=='TITLE'){
      for(const c of this.crystals) c.draw(CTX,this.camX);
      for(const l of this.lifeDrops) l.draw(CTX,this.camX);
      for(const b of this.bombCrystals) b.draw(CTX,this.camX);
      for(const o of this.obstacles) o.draw(CTX,this.camX);
      for(const e of this.enemies) e.draw(CTX,this.camX);
      if(this.boss) this.boss.draw(CTX,this.camX);
      // 子弹分两批绘制：先绘制玩家友方子弹，再绘制敌方子弹（确保敌弹在视觉上方，便于察觉）
      for(const b of this.bullets) if(b.friendly) b.draw(CTX,this.camX);
      for(const b of this.bullets) if(!b.friendly) b.draw(CTX,this.camX);
      for(const p of this.particles) p.draw(CTX,this.camX);
      if(this.player.alive) this.player.draw(CTX,this.camX);
      this.drawHUD();
    }
    if(this.flash>0){ CTX.fillStyle='rgba(255,255,255,'+clamp(this.flash,0,0.8)+')'; CTX.fillRect(0,0,W,H); }
    CTX.restore();

    if(this.state==='TITLE') this.drawTitle();
    else if(this.state==='PAUSED') this.drawPaused();
    else if(this.state==='GAME_OVER') this.drawGameOver();
    else if(this.state==='WIN') this.drawWin();
    else if(this.toastTimer>0) this.drawToast();
  }
  drawHUD(){
    CTX.save();
    CTX.font='bold 18px monospace'; CTX.textBaseline='top';
    CTX.fillStyle='#bffcff'; CTX.textAlign='left';
    CTX.fillText('SCORE  '+String(this.score).padStart(7,'0'),14,12);
    CTX.textAlign='right'; CTX.fillStyle='#9ef';
    CTX.fillText(this.level?this.level.name:'', W-14, 12);

    // 升级面板（左下）—— 数字键1-6
    CTX.textAlign='left'; CTX.textBaseline='bottom';
    // 能量晶体数
    let by=H-14;
    CTX.fillStyle=COLORS.crystal;
    CTX.font='bold 18px monospace';
    CTX.fillText('能量: '+this.player.crystals+'/'+CFG.maxCrystals, 14, by);
    // 清屏晶体库存（Shift 发动）
    by-=24;
    CTX.fillStyle='#3affd2';
    CTX.shadowBlur=6; CTX.shadowColor='#3affd2';
    CTX.fillText('清屏: '+this.player.bombs+'/2 [Shift]', 14, by);
    CTX.shadowBlur=0;

    // 6个升级项列表（右下竖排）
    const px=W-180, py0=H-14;
    CTX.font='bold 13px monospace'; CTX.textBaseline='bottom';
    for(let i=0;i<UPGRADES.length;i++){
      const up=UPGRADES[i];
      const py=py0 - (5-i)*20;
      // 多级升级：speed/missile 使用等级判定；其它用 abilities
      let owned=false, levelText='';
      if(up.id==='speed'){ owned=this.player.speedLevel>0; levelText=' '+this.player.speedLevel+'/5'; }
      else if(up.id==='missile'){ owned=this.player.missileLevel>0; levelText=' '+this.player.missileLevel+'/3'; }
      else { owned=this.player.abilities.has(up.id); }
      const maxed = (up.id==='speed'&&this.player.speedLevel>=5) || (up.id==='missile'&&this.player.missileLevel>=3);
      const enough = this.player.crystals >= up.cost;
      // 背景
      CTX.fillStyle = maxed ? 'rgba(94,255,154,0.25)' : (owned ? 'rgba(94,247,255,0.15)' : (enough ? 'rgba(255,210,77,0.1)' : 'rgba(40,40,40,0.3)'));
      CTX.fillRect(px-4, py-14, 176, 18);
      // 按键
      CTX.fillStyle = maxed ? '#5dff9a' : (owned ? '#5dff9a' : (enough ? COLORS.crystal : '#556'));
      CTX.fillText('['+up.key+']', px, py);
      // 名称
      CTX.fillStyle = maxed ? '#5dff9a' : (owned ? '#5dff9a' : '#cfe');
      let label = up.name + levelText;
      if(up.id==='wingman') label += ' '+this.player.wingmen.length+'/4';
      if(up.id==='shield') label += ' '+this.player.shieldHits+'/3';
      CTX.fillText(label, px+24, py);
      // 消耗
      CTX.fillStyle = maxed ? '#5dff9a' : (owned ? '#5dff9a' : (enough ? COLORS.crystal : '#933'));
      CTX.textAlign='right';
      CTX.fillText(maxed?'满级':(owned?'-'+up.cost+' →':('-'+up.cost)), px+170, py);
      CTX.textAlign='left';
    }

    // 左下：生命
    CTX.font='bold 18px monospace';
    by=H-14-24;
    CTX.fillStyle=COLORS.player; CTX.fillText('LIFE',14,by);
    for(let i=0;i<this.player.lives;i++){
      CTX.beginPath();
      CTX.moveTo(60+i*20,by-4); CTX.lineTo(54+i*20,by-12); CTX.lineTo(70+i*20,by-12);
      CTX.closePath(); CTX.fill();
    }

    // 关卡进度条
    if(this.state==='PLAYING' && !this.bossTriggered){
      const pw=420, ph=8, px2=(W-pw)/2, py=44;
      CTX.fillStyle='#112'; CTX.fillRect(px2-2,py-2,pw+4,ph+4);
      CTX.fillStyle='#224'; CTX.fillRect(px2,py,pw,ph);
      const r=clamp(this.scrollDistance/this.level.length,0,1);
      const g=CTX.createLinearGradient(px2,0,px2+pw,0);
      g.addColorStop(0,'#5ef7ff'); g.addColorStop(1,'#ffd24d');
      CTX.fillStyle=g; CTX.fillRect(px2,py,pw*r,ph);
      CTX.fillStyle='#9ef'; CTX.font='bold 11px monospace';
      CTX.textAlign='center'; CTX.textBaseline='bottom';
      CTX.fillText('BOSS', px2+pw, py-2);
      CTX.fillText(Math.floor(r*100)+'%', px2+pw/2, py-2);
    }

    // Boss 血条
    if(this.boss && !this.boss.dead){
      const bw=560, bh=14, bx=(W-bw)/2, by2=18;
      CTX.fillStyle='#220011'; CTX.fillRect(bx-2,by2-2,bw+4,bh+4);
      CTX.fillStyle='#440022'; CTX.fillRect(bx,by2,bw,bh);
      const r=clamp(this.boss.hp/this.boss.maxHp,0,1);
      const grad=CTX.createLinearGradient(bx,0,bx+bw,0);
      grad.addColorStop(0,this.boss.bossColor()); grad.addColorStop(1,'#ffd24d');
      CTX.fillStyle=grad; CTX.fillRect(bx,by2,bw*r,bh);
      CTX.fillStyle='#fff'; CTX.font='bold 12px monospace';
      CTX.textAlign='center'; CTX.textBaseline='bottom';
      CTX.fillText('BOSS · 阶段 '+this.boss.phase, W/2, by2-2);
    }
    CTX.restore();
  }
  drawToast(){
    CTX.save();
    const a=clamp(this.toastTimer,0,1);
    CTX.globalAlpha=a;
    // 提示文字位于屏幕下边，带半透明黑色底条增强可读性
    const barH=42, barY=H-barH-12;
    CTX.fillStyle='rgba(0,0,0,0.55)';
    CTX.fillRect(0, barY, W, barH);
    // 顶部细线（青色高亮）
    CTX.fillStyle='rgba(77,220,255,'+(0.7*a)+')';
    CTX.fillRect(0, barY, W, 2);
    // 文字：醒目青绿色 + 发光
    CTX.font='bold 22px monospace';
    CTX.textAlign='center'; CTX.textBaseline='middle';
    CTX.fillStyle='#3affd2';
    CTX.shadowBlur=14; CTX.shadowColor='#3affd2';
    CTX.fillText(this.toastText, W/2, barY+barH/2);
    CTX.restore();
  }
  drawTitle(){
    CTX.save();
    CTX.fillStyle='rgba(0,0,0,0.55)'; CTX.fillRect(0,0,W,H);
    CTX.textAlign='center';
    const g=CTX.createLinearGradient(0,80,0,180);
    g.addColorStop(0,'#5ef7ff'); g.addColorStop(1,'#ff4d8d');
    CTX.fillStyle=g; CTX.font='bold 60px monospace';
    CTX.shadowBlur=20; CTX.shadowColor='#5ef7ff';
    CTX.fillText('SALAMANDER-X', W/2, 110);
    CTX.shadowBlur=0;
    CTX.fillStyle='#9ef'; CTX.font='18px monospace';
    CTX.fillText('沙罗曼蛇 X · 能量晶体升级版', W/2, 150);

    // 难度选择（A/D 切换）
    CTX.textBaseline='middle';
    const diffY=192;
    CTX.fillStyle='rgba(255,210,77,0.10)';
    CTX.fillRect(W/2-180, diffY-18, 360, 36);
    CTX.fillStyle='#9cf'; CTX.font='14px monospace';
    CTX.textAlign='right';
    CTX.fillText('难度', W/2-30, diffY);
    CTX.textAlign='left';
    CTX.fillStyle='#ffd24d'; CTX.font='bold 22px monospace';
    CTX.shadowBlur=10; CTX.shadowColor='#ffd24d';
    // 闪烁的左右箭头
    if(Math.floor(performance.now()/400)%2===0){
      CTX.fillStyle='#fff';
      CTX.textAlign='right';
      CTX.fillText('◀', W/2-15, diffY);
      CTX.textAlign='left';
      CTX.fillText('▶', W/2+90, diffY);
      CTX.fillStyle='#ffd24d';
    }
    CTX.textAlign='center';
    CTX.fillText(DIFFICULTY[this.difficulty].label, W/2+40, diffY);
    CTX.shadowBlur=0;
    CTX.fillStyle='#9cf'; CTX.font='12px monospace';
    CTX.fillText(DIFFICULTY[this.difficulty].desc+'   [A / D 切换]', W/2, diffY+22);

    // 选关列表
    CTX.textBaseline='middle';
    CTX.font='bold 24px monospace';
    const options=['从头开始'];
    for(const lv of LEVELS) options.push(lv.name);
    const startY=240;
    const step=42;
    for(let i=0;i<options.length;i++){
      const y=startY+i*step;
      const sel=(i===this.titleSelected);
      if(sel){
        // 选中项高亮背景
        CTX.fillStyle='rgba(94,247,255,0.18)';
        CTX.fillRect(W/2-220, y-step/2-2, 440, step+4);
        // 左右箭头
        if(Math.floor(performance.now()/400)%2===0){
          CTX.fillStyle='#ffd24d';
          CTX.font='bold 22px monospace';
          CTX.textAlign='right';
          CTX.fillText('▶', W/2-200, y);
          CTX.textAlign='left';
          CTX.fillText('◀', W/2+200, y);
        }
        CTX.fillStyle='#ffd24d';
        CTX.font='bold 26px monospace';
      }else{
        CTX.fillStyle='#cfe';
        CTX.font='22px monospace';
      }
      CTX.textAlign='center';
      CTX.fillText(options[i], W/2, y);
    }

    // 操作说明
    CTX.textAlign='center';
    CTX.fillStyle='#9ef'; CTX.font='15px monospace';
    const help=[
      '↑↓ / W S   选择关卡',
      '回车       开始游戏',
      '',
      '游戏中：方向键移动  空格射击  数字键1-6升级  Shift清屏  P暂停',
    ];
    help.forEach((l,i)=> CTX.fillText(l, W/2, H-90+i*20));
    CTX.restore();
  }
  drawPaused(){
    CTX.save();
    CTX.fillStyle='rgba(0,0,0,0.6)'; CTX.fillRect(0,0,W,H);
    CTX.fillStyle='#fff'; CTX.font='bold 48px monospace';
    CTX.textAlign='center'; CTX.textBaseline='middle';
    CTX.fillText('PAUSED', W/2, H/2-20);
    CTX.font='18px monospace'; CTX.fillStyle='#9ef';
    CTX.fillText('按 P 继续', W/2, H/2+30);
    CTX.restore();
  }
  drawGameOver(){
    CTX.save();
    CTX.fillStyle='rgba(20,0,0,0.6)'; CTX.fillRect(0,0,W,H);
    CTX.fillStyle='#ff4d6d'; CTX.font='bold 64px monospace';
    CTX.textAlign='center'; CTX.textBaseline='middle';
    CTX.shadowBlur=18; CTX.shadowColor='#ff4d6d';
    CTX.fillText('GAME OVER', W/2, H/2-40);
    CTX.shadowBlur=0;
    CTX.fillStyle='#fff'; CTX.font='22px monospace';
    CTX.fillText('得分  '+this.score, W/2, H/2+20);
    CTX.fillText('击破  '+this.kills, W/2, H/2+54);
    CTX.fillStyle='#ffd24d'; CTX.font='18px monospace';
    if(Math.floor(performance.now()/500)%2===0) CTX.fillText('按 回车 回到选关画面', W/2, H-40);
    CTX.restore();
  }
  drawWin(){
    CTX.save();
    CTX.fillStyle='rgba(0,10,20,0.6)'; CTX.fillRect(0,0,W,H);
    const g=CTX.createLinearGradient(0,H/2-40,0,H/2+20);
    g.addColorStop(0,'#5ef7ff'); g.addColorStop(1,'#ffd24d');
    CTX.fillStyle=g; CTX.font='bold 56px monospace';
    CTX.textAlign='center'; CTX.textBaseline='middle';
    CTX.shadowBlur=18; CTX.shadowColor='#5ef7ff';
    CTX.fillText('MISSION COMPLETE', W/2, H/2-40);
    CTX.shadowBlur=0;
    CTX.fillStyle='#fff'; CTX.font='22px monospace';
    CTX.fillText('堡垒核心已摧毁！', W/2, H/2+10);
    CTX.fillText('最终得分  '+this.score, W/2, H/2+44);
    CTX.fillText('击破数    '+this.kills, W/2, H/2+76);
    CTX.fillStyle='#ffd24d'; CTX.font='18px monospace';
    if(Math.floor(performance.now()/500)%2===0) CTX.fillText('按 回车 回到选关画面', W/2, H-40);
    CTX.restore();
  }
}

/* ------------------------------ 启动 ------------------------------ */
Input.init();
const game=new Game();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  game.update(dt);
  game.render();
  Input.clearPressed();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
